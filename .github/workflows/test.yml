name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # [诊断·手动触发] 允许维护者手动触发本工作流，并可覆盖「测试目标 / PySide6 版本」，
  # 用于定位"仅单个矩阵格子失败"类问题 —— 例如 ubuntu-latest + 3.11 的 Qt
  # setStyleSheet 段错误（exit 139）：需区分"该文件单跑即崩"与"被前置测试污染"，
  # 或验证换 PySide6 版本是否消失。两个输入留空时行为与 push 触发完全一致。
  workflow_dispatch:
    inputs:
      pytest_target:
        description: '仅跑指定 pytest 目标（留空 = 全量 tests/）'
        required: false
        type: string
        default: ''
      pyside6_spec:
        description: '覆盖 PySide6 安装规格，如 ==6.10.3（留空 = 按 requirements.txt）'
        required: false
        type: string
        default: ''

# [P2 加固·最小权限] 此前未声明 permissions，GitHub 会授予仓库默认令牌权限
# （老仓库默认 read/write）。本工作流只做检出 + 跑测试，不需要任何写权限，
# 故显式收敛为 contents: read（与同目录 deploy-pages.yml 的写法一致）。
permissions:
  contents: read

# [P2 加固·并发去重] 同一分支连续推送时，旧的一次运行已无意义却仍占满 runner。
# cancel-in-progress 只对 PR 开启：对 main 分支的 push **不**取消 ——
# 否则主分支最后一次推送可能因前一次被取消而留下"未被验证"的空窗。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # [P2 加固·超时] 套件里有真实网络 / 子进程用例，一旦挂起会一直占满 runner
    # 直到 GitHub 默认 6 小时上限（表现为"一直在跑"而非快速失败）；显式上限兜底。
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 必须覆盖：ky_cli 里有独立的 darwin 分支（pbpaste 剪贴板读取、
        # Darwin 路径处理），此前 CI 从未执行过该分支，等于长期无人守门。
        # 本仓库为公开仓库，macOS runner 不额外计费。
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    # Windows runner 的默认控制台编码为 cp1252/cp936，脚本打印 ✅ / 中文时
    # 会抛 UnicodeEncodeError 并使步骤失败（本地 UTF-8 终端下不复现）。
    # 统一以 UTF-8 输出，避免编码差异造成的误报。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # [CI 稳定性] PySide6 用例在无桌面 runner 上必须使用 offscreen 平台，
      # 否则 Qt 找不到 platform plugin 会直接 abort（GUI 用例本机有桌面时
      # 不复现）。注意：此前把 macOS 的 exit 139 归因于 Qt，属**误判** ——
      # faulthandler 显示崩溃发生在 pymupdf 原生库 import 期（见下方
      # 「Drop PyMuPDF on macOS」步骤），offscreen 只解决 Qt 自身的无头问题。
      QT_QPA_PLATFORM: offscreen

    steps:
    # [P2 加固·Action 固定到 commit SHA] 浮动标签（@v4/@v5）可被上游静默改写，
    # 等于把 CI 执行权交给第三方 tag 的当前指向；pin 到完整 commit SHA 后，
    # 除非有人显式改本文件，跑的永远是同一份代码。
    # SHA 经 GitHub API 核实（2026-09-21）：
    #   actions/checkout      v4 → 11d5960a326750d5838078e36cf38b85af677262
    #   actions/setup-python  v5 → a26af69be951a213d495a4c3e4e4022e16d87065
    # 升级时请同步改 SHA 与行尾注释里的版本号。
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # dev extras 提供 pytest / pytest-timeout / pytest-socket：
        # pyproject 的 [tool.pytest.ini_options] 配置了 timeout，缺 pytest-timeout
        # 会报 "Unknown config option: timeout"，并被 filterwarnings=["error"]
        # 升级为 INTERNALERROR（本地装了插件故不复现）
        pip install -e ".[dev]"

    - name: '[诊断] 覆盖 PySide6 版本'
      # 仅 workflow_dispatch 且填写了 pyside6_spec 时生效；push / PR 恒跳过
      # （inputs 上下文在非手动触发时为空，取值为 null → falsy）。
      if: ${{ inputs.pyside6_spec }}
      run: python -m pip install "PySide6${{ inputs.pyside6_spec }}"

    - name: Drop PyMuPDF on macOS (native import crash)
      # [实测·根因] macOS 矩阵三个作业长期以 exit 139 收场，faulthandler 栈顶是
      #   pymupdf/mupdf.py:10 -> importlib create_module（原生扩展加载）
      # 触发链：tests/test_adversarial_resiliency.py:240
      #   -> tools/skills/material_ingestion.py:851 的 `import fitz`
      #   -> fitz/__init__.py:2 -> pymupdf/__init__.py:395 -> pymupdf.mupdf
      # 即 macOS arm64 wheel 在 **import 期**就段错误；段错误无法被 try/except
      # 捕获，整条 pytest 进程被带走（两次历史运行崩在同一处，与 Qt 无关）。
      # pymupdf 只是「测试侧造 PDF 样本」的可选工具：产品侧 material_ingestion
      # 对 `import fitz` 有降级、测试侧对 `import pymupdf` 有 skip 守卫，
      # 故 macOS 卸载它即可；Linux/Windows 保留，PDF 覆盖不减少。
      #
      # [A4·留痕] 本步骤此前是**静默卸载**：CI 日志里看不出 macOS 的 PDF 用例
      # 其实已被降级，容易误以为三平台覆盖一致。现补 ::warning:: 明示。
      #   影响面：仅 macOS 矩阵；只减少「测试侧造 PDF 样本 / 依赖 pymupdf 的
      #   用例」，Linux/Windows 覆盖完整（主平台不减少）。
      #   何时可去掉：待上游发布修复 macOS arm64 import 期段错误的版本，且在
      #   macos-latest 上验证 `pip install pymupdf && python -c "import pymupdf"`
      #   不再 exit 139 后，删除本步骤即可恢复 macOS 的 PDF 覆盖。
      if: runner.os == 'macOS'
      run: |
        echo "::warning::macOS 已卸载 pymupdf：其 arm64 wheel 在 import 期段错误（exit 139）会带走整个 pytest 进程。本平台 PDF 相关用例因此降级跳过（Linux/Windows 不受影响）；待上游修复后删除本步骤。"
        pip uninstall -y pymupdf

    - name: Run Ky Doctor Self-Check
      run: |
        python tools/doctor.py

    - name: Static Lint (zero-dependency)
      # 语法错误 / 裸 except / 可变默认参数 / 未使用导入 / 导入时副作用
      run: |
        python tools/lint_check.py --quiet

    - name: Dashboard Artifact Guard
      # 重新构建看板并校验产物内嵌 JS 语法 + 前端契约 + 无空图标
      # （历史上曾因模板引号错误导致整页 JS 失效却顺利通过 CI）
      run: |
        python tools/check_dashboard.py

    - name: Run Full Kaoyan Test Suite
      # 该套件会真实改写工作区用户数据（备考方案/今日任务/大纲），故内置守卫默认拒绝
      # 在真实考生工作区运行（exit 2）。CI 由 actions/checkout 做全新检出，工作区里
      # 不存在 ky_config.json（被 .gitignore 保护、未跟踪），守卫不会触发，无需额外放行。
      # 注意：正因为没有 ky_config.json，套件里 sync_publish 用例会走「无身份规则时
      # fail-closed 拒绝导出（exit 3）」分支 —— 这是预期行为，不是失败。
      # 本地复现请用干净副本，或设 KY_TEST_ALLOW_REAL_WORKSPACE=1 显式放行。
      run: |
        python tools/test_ky_suite.py

    - name: Run New-Feature Test Suite
      run: |
        python tools/test_new_features.py

    - name: Run pytest Unit/Process Suite
      # 命令本身与 shell 无关（不含 if/for/管道等 shell 语法），各平台用默认
      # shell 即可 —— 此前为跑一段 `if [ ... ]` 跳过 GUI 文件的脚本而显式
      # 指定 bash，属多余：那段脚本的立论（macOS 因 Qt 崩溃）已被证伪，
      # 真正的崩溃源是 pymupdf，已在安装阶段处理，无需再 --ignore 任何文件。
      run: |
        python -m pytest ${{ inputs.pytest_target || 'tests/' }} -q -p no:cacheprovider

    - name: Evaluate Pipeline Gate · FSRS 校准度（夹具 0/1/2 三条路径）
      # [A4 门禁收紧] 此前 evaluate_pipeline.py 只有单测覆盖，CI 从不运行它。
      # 不能直接跑真实数据：A1 修复后真实 .memory/review_log.jsonl 大概率返回 2
      # （样本不足；该文件被 .gitignore 排除，CI 全新检出时根本不存在），故改用
      # **已提交的夹具日志** tests/fixtures/srs_log_*.jsonl 跑通三条路径：
      #   退出码 0（达标）→ 通过；1（不达标）→ ::error:: 判红；
      #   2（样本不足）→ ::warning:: 跳过、不算失败；其他（含崩溃）→ 判红。
      # 每条夹具都按「应得退出码」断言：ok 必须 0；fail 必须 1（这是**阴性验证**
      # ——证明门禁真能识别不达标，而不是把 1 当成 CI 失败）；insufficient /
      # 全 stage0 残留必须 2（证明样本不足确实走告警跳过）。断言不符才判红。
      # 判定逻辑全部收在 tools/ci_evaluate_gate.py 的单个 Python 进程里：矩阵含
      # Windows，pwsh 下多行 run 的退出码由**最后一条命令**决定，前一条命令失败
      # 会被静默掩盖；而 continue-on-error 又无法区分「真不达标」与「样本不足」。
      run: |
        python tools/ci_evaluate_gate.py --fixtures

    - name: Evaluate Pipeline Gate · 引文忠实度 (--ragas)
      # [C2 可证] 反幻觉闸门的功能评测：tests/benchmarks/citation_faithfulness.jsonl
      # （109 条，覆盖无据引用 / 伪造 URL / 过期数据 / 跨校混淆 / 二手源冒充），
      # 按 kind 分发到 citation_engine.verify_citations / evidence_engine.build_evidence
      # / resolve_conflicts / DocumentExtractor 四个被测对象。完全离线（无网络 /
      # LLM / API Key、不计费）。双阈值：拦截侧必须 100%（漏放一条编造引用即红线
      # 失守）、放行侧 ≥98%（误拦容错）。0/1/2 语义与 --srs 相同。
      run: |
        python tools/ci_evaluate_gate.py --ragas

    - name: Evaluate Pipeline Gate · 考纲守卫 (--syllabus)
      # [C1 可证] 考纲红线拦截的功能评测：tests/benchmarks/syllabus_guard.jsonl
      # （128 条 = math1/2/3/396 × 正/负样本，否定/笔记语境 ≥30%），逐条跑
      # agent.hooks 的 syllabus_guard_hook。完全离线（纯正则 + 本地 Hook，
      # 无网络 / LLM / API Key、不计费）。达标阈值 98%：
      #   退出码 0（达标）→ 通过；1（不达标）→ ::error:: 判红；
      #   2（评测集缺失/损坏）→ ::warning:: 跳过（数据问题不当产品缺陷判红）。
      run: |
        python tools/ci_evaluate_gate.py --syllabus

    - name: Workspace Pollution Guard (tests must not dirty the tree)
      # [P2 加固] 「测试不得污染工作区」此前只靠约定：单个用例用 tmp_path 隔离
      # 是自觉行为，没人守门。这里在**全部测试跑完之后**断言工作区必须干净 ——
      # 任何残留改动即判失败（tools/test_ky_suite.py 内部本就有快照/还原机制，
      # 正是为了满足这条不变式；此步把该不变式变成硬门禁）。
      #
      # 取舍：只排除**真正的构建产物** —— ``check_dashboard.py`` 每次都会重写
      # ``docs/index.html`` 与 ``docs/state_snapshot.json``（本地 `git status`
      # 亦长期显示为 M），属预期变化，故显式排除这两个文件；
      # ``.config_backup/``（配置守卫快照）已**移出仓库根**（新写入去
      # ``%LOCALAPPDATA%/kaoyan-study-chain/config_backup``，见
      # ``tools/config_guard.default_backup_dir``），正常不会再出现在工作区；
      # 保留该排除项作纵深防御（旧的仓库内目录读取仍兼容）。
      #
      # [P2 加固·排除范围过宽] 早前用 `':!docs'` 把 **docs/ 整目录**排除，但
      # `docs/live.html` 是**手写源文件**、`docs/assets/vendor/**` 是随仓库分发的
      # 第三方资源 —— 它们并不由构建生成，整目录排除与"其余任何 tracked 文件的
      # 改动都会被抓到"自相矛盾（实测 docs/ 命中 0 项）。现收窄到具体生成物。
      shell: bash
      run: |
        dirty="$(git status --porcelain -- \
          ':!docs/index.html' \
          ':!docs/state_snapshot.json' \
          ':!.config_backup')"
        if [ -n "$dirty" ]; then
          echo "::error::测试污染了工作区，以下路径在测试后出现改动/新增："
          echo "$dirty"
          exit 1
        fi
        echo "[OK] 工作区干净（仅排除 docs/index.html、docs/state_snapshot.json 两个生成物）"

  rust-ext:
    # [S-6] Rust 原生加速扩展 (ky_rust_ext) 此前从未在 CI 中编译验证过 ——
    # 一旦 PyO3 版本升级或源码失效，只有用户在本地编译时才会发现。
    # [A4 门禁收紧] 现为**硬门禁**（此前 continue-on-error: true，编译失效无人
    # 发现，审查结论 G8 明确要求收紧）：编译失败将阻塞合并。
    # 与「运行期可选依赖」不矛盾：运行时 Rust 缺失仍透明降级为纯 Python 等价
    # 实现（因此不把 Rust 列为安装前提），但**源码与构建配置必须始终可编译**，
    # 这是源码级的可维护性要求，不能再靠「失败仅告警」蒙混。
    runs-on: ubuntu-latest
    # [P2 加固·超时] 挂起时表现为「一直在跑」而非快速失败，需要显式上限兜底
    # （默认 6 小时会白占 runner）；25 分钟覆盖冷启动拉取 Rust 工具链 + 全量编译。
    timeout-minutes: 25
    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.12"

    - name: Build ky_rust_ext with maturin
      run: |
        python -m pip install --upgrade pip maturin
        cd rust_ext
        maturin build --release
        echo "[OK] ky_rust_ext 编译通过，产物："
        ls -l target/wheels/

    - name: Install built wheel and verify it actually works
      # [A4] 此前只验证「编译出了 wheel 文件」（ls 到即算通过），产物能否被安装、
      # 导入、且结果与标准库一致从未验证 —— 编译成功但 ABI 标签错误或扩展未正确
      # 打包的 wheel，只有用户装上才会发现。成本很低（一次 pip install + 一次哈希
      # 比对，约十几秒），故补上；断言口径与 tools/test_new_features.py 的
      # 「Rust vs Python 双模一致性」一致：sha256_hash 必须与标准库 hashlib 逐位相同
      # （样本含中文与长串，覆盖 UTF-8 与分块路径）。
      env:
        PYTHONIOENCODING: utf-8
      run: |
        pip install rust_ext/target/wheels/ky_rust_ext-*.whl
        python -c "import hashlib, ky_rust_ext as r; samples = ['hello world', '考研数学二高等数学导数中值定理', '', 'A' * 10000]; assert all(r.sha256_hash(s) == hashlib.sha256(s.encode('utf-8')).hexdigest() for s in samples), 'sha256_hash 与 hashlib 不一致'; print('[OK] wheel 可安装、可导入，sha256_hash 与标准库 hashlib 逐位一致')"
