name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 必须覆盖：ky_cli 里有独立的 darwin 分支（pbpaste 剪贴板读取、
        # Darwin 路径处理），此前 CI 从未执行过该分支，等于长期无人守门。
        # 本仓库为公开仓库，macOS runner 不额外计费。
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    # Windows runner 的默认控制台编码为 cp1252/cp936，脚本打印 ✅ / 中文时
    # 会抛 UnicodeEncodeError 并使步骤失败（本地 UTF-8 终端下不复现）。
    # 统一以 UTF-8 输出，避免编码差异造成的误报。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # dev extras 提供 pytest / pytest-timeout / pytest-socket：
        # pyproject 的 [tool.pytest.ini_options] 配置了 timeout，缺 pytest-timeout
        # 会报 "Unknown config option: timeout"，并被 filterwarnings=["error"]
        # 升级为 INTERNALERROR（本地装了插件故不复现）
        pip install -e ".[dev]"

    - name: Run Ky Doctor Self-Check
      run: |
        python tools/doctor.py

    - name: Static Lint (zero-dependency)
      # 语法错误 / 裸 except / 可变默认参数 / 未使用导入 / 导入时副作用
      run: |
        python tools/lint_check.py --quiet

    - name: Dashboard Artifact Guard
      # 重新构建看板并校验产物内嵌 JS 语法 + 前端契约 + 无空图标
      # （历史上曾因模板引号错误导致整页 JS 失效却顺利通过 CI）
      run: |
        python tools/check_dashboard.py

    - name: Run Full Kaoyan Test Suite
      run: |
        python tools/test_ky_suite.py

    - name: Run New-Feature Test Suite
      run: |
        python tools/test_new_features.py

    - name: Run pytest Unit/Process Suite
      run: |
        python -m pytest tests/ -q -p no:cacheprovider

  rust-ext:
    # [S-6] Rust 原生加速扩展 (ky_rust_ext) 此前从未在 CI 中编译验证过 ——
    # 一旦 PyO3 版本升级或源码失效，只有用户在本地编译时才会发现。
    # 该项目声明 Rust 为**可选**依赖、缺失时透明降级为纯 Python 等价实现，
    # 故此处只做「编译可用性验证」而非硬门禁：continue-on-error 让失败仅告警、
    # 不阻塞合并（编译结果仍可在 log 中查证）。
    # 若希望它成为硬门禁（合并前必须可编译），删除下面这行 continue-on-error 即可。
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build ky_rust_ext with maturin
      run: |
        python -m pip install --upgrade pip maturin
        cd rust_ext
        maturin build --release
        echo "[OK] ky_rust_ext 编译通过，产物："
        ls -l target/wheels/
