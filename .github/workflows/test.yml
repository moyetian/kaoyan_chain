name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# [P2 加固·最小权限] 此前未声明 permissions，GitHub 会授予仓库默认令牌权限
# （老仓库默认 read/write）。本工作流只做检出 + 跑测试，不需要任何写权限，
# 故显式收敛为 contents: read（与同目录 deploy-pages.yml 的写法一致）。
permissions:
  contents: read

# [P2 加固·并发去重] 同一分支连续推送时，旧的一次运行已无意义却仍占满 runner。
# cancel-in-progress 只对 PR 开启：对 main 分支的 push **不**取消 ——
# 否则主分支最后一次推送可能因前一次被取消而留下"未被验证"的空窗。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # [P2 加固·超时] 套件里有真实网络 / 子进程用例，一旦挂起会一直占满 runner
    # 直到 GitHub 默认 6 小时上限（表现为"一直在跑"而非快速失败）；显式上限兜底。
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 必须覆盖：ky_cli 里有独立的 darwin 分支（pbpaste 剪贴板读取、
        # Darwin 路径处理），此前 CI 从未执行过该分支，等于长期无人守门。
        # 本仓库为公开仓库，macOS runner 不额外计费。
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    # Windows runner 的默认控制台编码为 cp1252/cp936，脚本打印 ✅ / 中文时
    # 会抛 UnicodeEncodeError 并使步骤失败（本地 UTF-8 终端下不复现）。
    # 统一以 UTF-8 输出，避免编码差异造成的误报。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # [CI 稳定性] PySide6 用例在无桌面 runner 上必须使用 offscreen 平台，
      # 否则 Qt 找不到 platform plugin 会直接 abort（GUI 用例本机有桌面时
      # 不复现）。注意：此前把 macOS 的 exit 139 归因于 Qt，属**误判** ——
      # faulthandler 显示崩溃发生在 pymupdf 原生库 import 期（见下方
      # 「Drop PyMuPDF on macOS」步骤），offscreen 只解决 Qt 自身的无头问题。
      QT_QPA_PLATFORM: offscreen

    steps:
    # [P2 加固·Action 固定到 commit SHA] 浮动标签（@v4/@v5）可被上游静默改写，
    # 等于把 CI 执行权交给第三方 tag 的当前指向；pin 到完整 commit SHA 后，
    # 除非有人显式改本文件，跑的永远是同一份代码。
    # SHA 经 GitHub API 核实（2026-09-21）：
    #   actions/checkout      v4 → 11d5960a326750d5838078e36cf38b85af677262
    #   actions/setup-python  v5 → a26af69be951a213d495a4c3e4e4022e16d87065
    # 升级时请同步改 SHA 与行尾注释里的版本号。
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # dev extras 提供 pytest / pytest-timeout / pytest-socket：
        # pyproject 的 [tool.pytest.ini_options] 配置了 timeout，缺 pytest-timeout
        # 会报 "Unknown config option: timeout"，并被 filterwarnings=["error"]
        # 升级为 INTERNALERROR（本地装了插件故不复现）
        pip install -e ".[dev]"

    - name: Drop PyMuPDF on macOS (native import crash)
      # [实测·根因] macOS 矩阵三个作业长期以 exit 139 收场，faulthandler 栈顶是
      #   pymupdf/mupdf.py:10 -> importlib create_module（原生扩展加载）
      # 触发链：tests/test_adversarial_resiliency.py:240
      #   -> tools/skills/material_ingestion.py:851 的 `import fitz`
      #   -> fitz/__init__.py:2 -> pymupdf/__init__.py:395 -> pymupdf.mupdf
      # 即 macOS arm64 wheel 在 **import 期**就段错误；段错误无法被 try/except
      # 捕获，整条 pytest 进程被带走（两次历史运行崩在同一处，与 Qt 无关）。
      # pymupdf 只是「测试侧造 PDF 样本」的可选工具：产品侧 material_ingestion
      # 对 `import fitz` 有降级、测试侧对 `import pymupdf` 有 skip 守卫，
      # 故 macOS 卸载它即可；Linux/Windows 保留，PDF 覆盖不减少。
      if: runner.os == 'macOS'
      run: |
        pip uninstall -y pymupdf

    - name: Run Ky Doctor Self-Check
      run: |
        python tools/doctor.py

    - name: Static Lint (zero-dependency)
      # 语法错误 / 裸 except / 可变默认参数 / 未使用导入 / 导入时副作用
      run: |
        python tools/lint_check.py --quiet

    - name: Dashboard Artifact Guard
      # 重新构建看板并校验产物内嵌 JS 语法 + 前端契约 + 无空图标
      # （历史上曾因模板引号错误导致整页 JS 失效却顺利通过 CI）
      run: |
        python tools/check_dashboard.py

    - name: Run Full Kaoyan Test Suite
      # 该套件会真实改写工作区用户数据（备考方案/今日任务/大纲），故内置守卫默认拒绝
      # 在真实考生工作区运行（exit 2）。CI 由 actions/checkout 做全新检出，工作区里
      # 不存在 ky_config.json（被 .gitignore 保护、未跟踪），守卫不会触发，无需额外放行。
      # 注意：正因为没有 ky_config.json，套件里 sync_publish 用例会走「无身份规则时
      # fail-closed 拒绝导出（exit 3）」分支 —— 这是预期行为，不是失败。
      # 本地复现请用干净副本，或设 KY_TEST_ALLOW_REAL_WORKSPACE=1 显式放行。
      run: |
        python tools/test_ky_suite.py

    - name: Run New-Feature Test Suite
      run: |
        python tools/test_new_features.py

    - name: Run pytest Unit/Process Suite
      # 命令本身与 shell 无关（不含 if/for/管道等 shell 语法），各平台用默认
      # shell 即可 —— 此前为跑一段 `if [ ... ]` 跳过 GUI 文件的脚本而显式
      # 指定 bash，属多余：那段脚本的立论（macOS 因 Qt 崩溃）已被证伪，
      # 真正的崩溃源是 pymupdf，已在安装阶段处理，无需再 --ignore 任何文件。
      run: |
        python -m pytest tests/ -q -p no:cacheprovider

    - name: Workspace Pollution Guard (tests must not dirty the tree)
      # [P2 加固] 「测试不得污染工作区」此前只靠约定：单个用例用 tmp_path 隔离
      # 是自觉行为，没人守门。这里在**全部测试跑完之后**断言工作区必须干净 ——
      # 任何残留改动即判失败（tools/test_ky_suite.py 内部本就有快照/还原机制，
      # 正是为了满足这条不变式；此步把该不变式变成硬门禁）。
      #
      # 取舍：只排除**真正的构建产物** —— ``check_dashboard.py`` 每次都会重写
      # ``docs/index.html`` 与 ``docs/state_snapshot.json``（本地 `git status`
      # 亦长期显示为 M），属预期变化，故显式排除这两个文件；
      # ``.config_backup/``（配置守卫快照）已**移出仓库根**（新写入去
      # ``%LOCALAPPDATA%/kaoyan-study-chain/config_backup``，见
      # ``tools/config_guard.default_backup_dir``），正常不会再出现在工作区；
      # 保留该排除项作纵深防御（旧的仓库内目录读取仍兼容）。
      #
      # [P2 加固·排除范围过宽] 早前用 `':!docs'` 把 **docs/ 整目录**排除，但
      # `docs/live.html` 是**手写源文件**、`docs/assets/vendor/**` 是随仓库分发的
      # 第三方资源 —— 它们并不由构建生成，整目录排除与"其余任何 tracked 文件的
      # 改动都会被抓到"自相矛盾（实测 docs/ 命中 0 项）。现收窄到具体生成物。
      shell: bash
      run: |
        dirty="$(git status --porcelain -- \
          ':!docs/index.html' \
          ':!docs/state_snapshot.json' \
          ':!.config_backup')"
        if [ -n "$dirty" ]; then
          echo "::error::测试污染了工作区，以下路径在测试后出现改动/新增："
          echo "$dirty"
          exit 1
        fi
        echo "[OK] 工作区干净（仅排除 docs/index.html、docs/state_snapshot.json 两个生成物）"

  rust-ext:
    # [S-6] Rust 原生加速扩展 (ky_rust_ext) 此前从未在 CI 中编译验证过 ——
    # 一旦 PyO3 版本升级或源码失效，只有用户在本地编译时才会发现。
    # 该项目声明 Rust 为**可选**依赖、缺失时透明降级为纯 Python 等价实现，
    # 故此处只做「编译可用性验证」而非硬门禁：continue-on-error 让失败仅告警、
    # 不阻塞合并（编译结果仍可在 log 中查证）。
    # 若希望它成为硬门禁（合并前必须可编译），删除下面这行 continue-on-error 即可。
    runs-on: ubuntu-latest
    continue-on-error: true
    # [P2 加固·超时] continue-on-error 时挂起表现为「一直在跑」而非快速失败，
    # 更需要显式上限兜底（默认 6 小时会白占 runner）。
    timeout-minutes: 25
    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.12"

    - name: Build ky_rust_ext with maturin
      run: |
        python -m pip install --upgrade pip maturin
        cd rust_ext
        maturin build --release
        echo "[OK] ky_rust_ext 编译通过，产物："
        ls -l target/wheels/
