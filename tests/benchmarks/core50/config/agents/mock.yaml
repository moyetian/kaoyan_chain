# mock：离线预设答案 Runner（B-07）
# 用途：在**完全不联网、不调用任何模型**的情况下跑通「任务 → Runner → 日志 → 评分 → 报告」全链路。
# 任务集工程师需为每个被测 task_id 在此登记一份**真实做过题**的预设答案（而非照抄题面）；
# 也可用 "*" 提供兜底默认答案。hybrid 任务在无 API key 时走降级规则化评分，
# 故预设答案需覆盖 expected.must_find 要点、required_fields 与来源等级。
name: mock
type: mock
version: "1.0.0"
model: mock-model
provider: mock

# 解析 stdout 的字段名（与 mock 输出的 JSON blob 对齐）
parse:
  format: json
  answer_field: final_answer
  toolcalls_field: tool_calls
  sources_field: sources
  citations_field: citations
  usage_field: usage
  search_trace_field: search_trace

params:
  # 可选的额外答案文件（JSON，{task_id: preset}），供任务集工程师补充而不改本文件。
  # answers 段与 params.answers 两种写法等价；params.answers 亦为一等字段（后端已修）。
  answers_file: ""

answers:
  # 兜底：任何未显式登记的 task_id 都返回这份默认答案。
  "*":
    final_answer: "（mock 默认答案）本题未在 config/agents/mock.yaml 的 answers 段登记预设内容。"
    usage_source: "none"

  # T 类交付：core50 全 50 题的确定性离线预设答案（保证 CI 全离线可跑）。
  # 每题给出「真实做过题」的答案：fixture 计算值 / 结构化字段 / 来源等级，而非照抄题面。
