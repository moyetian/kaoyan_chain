<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- [前端修复·viewport 缩放锁] 原先带 maximum-scale=1，禁止用户双指放大，
     违反 WCAG 2.1 1.4.4（Resize text）。低视力考生无法放大正文/公式。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#090d16" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<script>
/* [UX 升级 · 消除首屏主题闪烁 FOUC]
   旧实现把主题恢复放在页面末尾、且在所有 CDN <script src> 之后，
   浏览器必然先用默认（或系统）配色绘制一帧再跳变。
   主题必须在**首次绘制之前**确定，故前置到 <head> 内、任何外链之前。
   注：此处刻意不依赖任何外部脚本，纯同步执行。
   [主题预设选择器] KY_PRESETS 是 5 套预设的键/显示名/明暗，KY_RHYTHM 是按
   距初试天数推荐的「备考节律」主题。用户手动选过主题时 localStorage 优先，
   否则用节律主题 —— 两者都在首次绘制前确定，避免闪一下再跳变。 */
var KY_PRESETS={{THEME_PRESETS}};
var KY_RHYTHM={{RHYTHM}};
var KY_MODE={};KY_PRESETS.forEach(function(p){KY_MODE[p.k]=p.m;});
(function(){
  try{
    var t=localStorage.getItem('kytheme');
    if(!t||KY_MODE[t]===undefined) t=KY_RHYTHM.p;
    document.documentElement.setAttribute('data-t',t);
  }catch(e){}
})();
</script>
<title>考研学习看板 · 倒计时 {{DDAY1}} 天</title>
<link rel="stylesheet" href="{{KATEX_CSS}}">
<style>
/* ── 主题变量（由 tools/theme 从语义 token 编译注入，勿手工编辑） ──────
   这里原先硬编码了四段变量：默认亮色 / prefers-color-scheme 深色 /
   [data-t=dark] / [data-t=light]。四端各有一套色值正是「四个端四种紫」的根因；
   现在统一由 build.py 注入主题变量，与 GUI / 终端共用同一组 token。 */
{{THEME_CSS}}

/* ── 键盘焦点可见性（全站统一焦点环） ──────────────────────────────
   改造前全站 :focus/:focus-visible 样式为 0 处，键盘用户只能依赖浏览器
   默认焦点环；而 .card/.chip/遮罩单元格等是 div/span/td 且不可聚焦，
   键盘完全无法操作。此处统一焦点样式，并只对键盘交互展示（:focus-visible），
   鼠标点击不出现焦点环，避免视觉噪音。 */
:focus-visible{
  outline:calc(var(--focus-w) * 1px) solid var(--focus-ring);
  outline-offset:2px;
  border-radius:6px;
}
/* 跳到主内容：键盘用户的第一个 Tab 落点（默认视觉隐藏，聚焦时显现） */
.skip-link{
  position:absolute;left:8px;top:-48px;z-index:99;
  padding:8px 14px;border-radius:0 0 10px 10px;
  background:var(--acc);color:#fff;font-size:13px;font-weight:600;text-decoration:none;
  transition:top var(--dur-fast) var(--ease-std);
}
.skip-link:focus{top:0;}
/* 仅供屏幕阅读器播报（视觉不可见但不使用 display:none，否则读屏也读不到） */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}

/* ── 减少动态效果偏好（无障碍必需项） ──────────────────────────────
   改造前 CSS 中 prefers-reduced-motion 为 0 处，只有彩带在 JS 里做了判断：
   开启系统"减少动态效果"后，翻卡 3D 旋转(.48s)、页签淡入、进度条增长(1s)、
   遮罩模糊过渡仍然照跑，对前庭敏感用户不友好。
   此处统一把动效压到近乎瞬时（保留 0.01ms 而非 0，以便依赖 transitionend 的逻辑仍能触发）。 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ══ 布局外壳（移动优先） ══════════════════════════════════════════
   [缺陷修复·媒体查询反向覆盖] 改造前桌面端规则写在前部、基础规则写在后部且
   特异性相同，于是桌面规则被基础规则覆盖 —— 两处实证：
     · .wrap 的 max-width:1080px/margin-left:240px 被后面的
       .wrap{max-width:820px;margin:0 auto} 吃掉（1440px 视口下内容只占约 790px）；
     · .bar button 的 flex:none;padding:12px 16px 被后面的
       flex:1;padding:9px 4px 10px 吃掉 → 侧栏 6 项纵向平分视口，
       激活项变成约 130px 的巨型高亮块。
   现统一为「基础/移动优先规则在前，桌面媒体查询集中在 <style> 末尾」，
   两者不再互相覆盖（顺序本身即修复的一部分，勿把桌面段前移）。 */
:root{--sbw:240px}                 /* 侧栏宽度：桌面 .sidebar 与 .wrap 共用同一真源 */
.sidebar{position:fixed;left:0;right:0;bottom:0;z-index:40}
.brand{display:none}                /* 品牌区只在桌面侧栏出现（移动端底栏无空间） */
.bar{display:flex;
 background:color-mix(in srgb,var(--surf) 90%,transparent);
 backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
 border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
 box-shadow:0 -4px 16px rgba(0,0,0,.03)}

/* Primary buttons and progress bar gradients */
.pfill{height:100%;border-radius:99px;background:var(--acc-grad);transition:width var(--dur-slow) var(--ease-std)}
.tbtn.on{background:var(--acc-grad);color:#fff;border-color:transparent;font-weight:700}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
/* [P1 字体栈] 消费设计系统 token var(--font-family)（此前全仓无消费点，
   body 用的是另一套硬编码栈 → token 改了页面也不会变）。var() 带兜底值：
   tools/theme 不可用时（兜底 CSS 无该变量）仍落到系统栈，不会退化成 serif。 */
body{margin:0;background:var(--bg);color:var(--fg);
 font-size:var(--fs-body);line-height:1.6;
 font-family:var(--font-family,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif);
 -webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom));
 transition:background var(--dur-base) var(--ease-std),color var(--dur-base) var(--ease-std)}
/* [P1 布局] .wrap 不再设 1080/820 宽度上限：内容填满可用宽度（宽屏由 .dash
   的 12 栏网格分配，窄屏降级单列）。 */
.wrap{max-width:none;margin:0;padding:0 var(--space-4)}

/* ══ 首屏：倒计时 hero 卡 ══════════════════════════════════════════
   改造前页头是「56px 数字 + 右上角 4 组信息 + 全宽进度行」的堆叠，信息挤在
   一角、主次不分。现改为一张渐变 hero 卡：环形进度 + 大数字倒计时 +
   初试日期 + 备考进度条，科目归档条收进卡内底部。
   渐变方向取 315deg（左下浅 → 右上深）：文字所在的左上角落在 acc-grad-to
   一端，五套预设下 on-acc 对它的对比度均 ≥5:1；若沿用 135deg，浅色预设的
   文字会压在 acc-grad-from（#a78bfa）上，实测仅 2.72:1，不达 AA。 */
.hero{position:relative;overflow:hidden;color:var(--on-acc);
 background:linear-gradient(315deg,var(--acc-grad-from),var(--acc-grad-to));
 border-radius:calc(var(--radius) * 1px);box-shadow:var(--elev-2);
 padding:var(--space-5) var(--space-4) var(--space-4)}
.hero::after{content:"";position:absolute;right:-56px;bottom:-72px;width:200px;height:200px;
 border-radius:50%;background:color-mix(in srgb,var(--on-acc) 10%,transparent);pointer-events:none}
.hero-in{position:relative;display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap}
.hero-ring{position:relative;flex:0 0 auto;width:112px;height:112px}
.hero-ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
/* pathLength=100 把圆周长归一到 100，故 dasharray/dashoffset 可直接按百分比算 */
.ring-track{fill:none;stroke:color-mix(in srgb,var(--on-acc) 22%,transparent);stroke-width:8}
.ring-fill{fill:none;stroke:var(--on-acc);stroke-width:8;stroke-linecap:round;
 transition:stroke-dashoffset var(--dur-slow) var(--ease-std)}
.hero-ring-c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px}
.hero-num{font-size:var(--fs-hero);font-weight:850;letter-spacing:-.04em;
 font-variant-numeric:tabular-nums;line-height:1}
.hero-unit{font-size:var(--fs-caption);font-weight:700;align-self:flex-end;margin-bottom:5px}
.hero-info{flex:1 1 190px;min-width:0}
.hero-lb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-caption);
 font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.hero-title{margin-top:var(--space-2);font-size:var(--fs-title);font-weight:800;
 letter-spacing:-.01em;line-height:1.3}
.hero-meta{margin-top:var(--space-1);font-size:var(--fs-body);font-weight:600}
/* hero 内的进度条改走 on-acc：底色上的 .pfill 原本也是 acc-grad，会与卡底同色隐形 */
.hero .plan{margin:var(--space-4) 0 0}
.hero .pt{color:var(--on-acc);font-size:var(--fs-caption)}
.hero .ptrack{background:color-mix(in srgb,var(--on-acc) 22%,transparent);border-color:transparent}
.hero .pfill{background:var(--on-acc)}
.hero-subs{position:relative;margin-top:var(--space-4)}

/* ══ KPI 卡（近 7 日） ════════════════════════════════════════════
   [P1] 落实「给数字配上下文」：指标名 + 数值 + 7 日 sparkline + 一句昨日对比。
   数据全部取自内联的 D.trend（completion_history），不新增构建期占位符；
   无数据时走空状态三件套（图标 / 说明 / CTA，见 DESIGN.md §6.4）。 */
/* 首屏网格：移动端单列堆叠，桌面端升级为 12 栏（见文件末尾覆盖段） */
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-3)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.kpi{min-width:0;display:flex;flex-direction:column;gap:var(--space-2);
 background:var(--surf);border:1px solid var(--line);border-radius:calc(var(--radius) * 1px);
 box-shadow:var(--elev-1);padding:var(--space-3);
 transition:border-color var(--dur-fast) var(--ease-std),box-shadow var(--dur-fast) var(--ease-std)}
.kpi:hover{border-color:var(--acc-line);box-shadow:var(--elev-2)}
.kpi-h{display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-caption);
 color:var(--mut);font-weight:700}
.kpi-h .ic{flex:0 0 auto;color:var(--c,var(--acc))}
.kpi-v{font-size:var(--fs-title);font-weight:850;letter-spacing:-.02em;
 font-variant-numeric:tabular-nums;line-height:1.1;color:var(--fg)}
.kpi-v .u{font-size:var(--fs-caption);font-weight:700;color:var(--mut);margin-left:2px}
.kpi-spark{height:28px;color:var(--c,var(--acc))}
.spark{display:block;width:100%;height:28px;overflow:visible}
.spark-base{stroke:var(--line);stroke-width:2;stroke-dasharray:4 4}
.kpi-ctx{font-size:var(--fs-caption);color:var(--mut);line-height:1.45}
.kpi-ctx b{color:var(--fg);font-weight:700}
.kpi-ctx.up b{color:var(--ok)}
.kpi-ctx.down b{color:var(--bad)}
.kpi-ctx.warn b{color:var(--warn)}
.kpi-empty{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)}
.kpi-empty .ed{font-size:var(--fs-caption);color:var(--mut);line-height:1.45}

/* ══ 内容面板卡 ══════════════════════════════════════════════════ */
.panel{margin-top:var(--space-3);background:var(--surf);border:1px solid var(--line);
 border-radius:calc(var(--radius) * 1px);box-shadow:var(--elev-1);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:var(--space-2);
 padding:var(--space-3) var(--space-4);background:var(--surf2);border-bottom:1px solid var(--line)}
.panel-h .ic{display:flex;flex:0 0 auto;color:var(--acc)}
.panel-h h2{margin:0;font-size:var(--fs-body);font-weight:800;letter-spacing:-.01em}
.panel-h .sp{margin-left:auto;display:flex;align-items:center;gap:var(--space-2)}
.panel-b{padding:0}
/* 面板内的学科块拍平成「分区 + 细分隔线」，避免卡中卡 */
.panel-b .blk{margin:0;border:0;border-radius:0;box-shadow:none;background:transparent}
.panel-b .blk + .blk{border-top:1px solid var(--line)}

/* ── 顶部工具条（主题 / 动效） ────────────────────────────────────
   [P1 信息层级] 改造前主题按钮、动效开关、初试首日、备考天数 4 组信息全部
   挤在右上角 .hr2 里，还叠着一条全宽进度行，主次不分。现拆开：
   考期信息进 hero 卡，只留两个紧凑 pill 在右上工具条。 */
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:var(--space-2);
 padding:var(--space-3) 0 var(--space-2)}
.tbtn-theme,.fx-btn{display:inline-flex;align-items:center;gap:var(--space-1);
 background:var(--surf);border:1px solid var(--line);border-radius:99px;
 padding:var(--space-1) var(--space-3);font:inherit;font-size:var(--fs-caption);
 color:var(--mut);cursor:pointer;box-shadow:var(--elev-1);
 transition:color var(--dur-fast) var(--ease-std),border-color var(--dur-fast) var(--ease-std)}
.tbtn-theme:hover,.fx-btn:hover{border-color:var(--acc-line);color:var(--fg)}
.tbtn-theme .ic,.fx-btn .ic{display:flex;color:var(--acc)}
.fx-btn[aria-pressed="false"]{opacity:.7}

/* ── 备考进度条（hero 卡与图谱摘要共用） ────────────────────────── */
.plan{margin:var(--space-4) 0 var(--space-1)}
.plan .pt{display:flex;justify-content:space-between;font-size:var(--fs-caption);
 color:var(--mut);margin-bottom:var(--space-2);font-weight:600}
.ptrack{height:7px;background:var(--surf2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}

/* ── 科目归档条（hero 卡内） ──────────────────────────────────────
   列宽必须用 minmax(0,1fr) 而非 1fr：1fr 的自动下限是 min-content，
   卡片固有最小宽度之和会直接把页面撑破（实测 390px 视口下文档宽 825px，
   手机端出现横向滚动、卡片被裁切）。 */
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--space-2)}
.sub{min-width:0;display:flex;align-items:center;gap:var(--space-2);
 background:var(--surf);border:1px solid var(--line);
 border-radius:calc(var(--radius-sm) * 1px);padding:var(--space-2) var(--space-3);
 box-shadow:var(--elev-1);transition:border-color var(--dur-fast) var(--ease-std)}
.sub:hover{border-color:var(--acc-line)}   /* DESIGN.md §6.1：悬停不位移，避免布局抖动 */
.sub .si{display:flex;flex:0 0 auto;font-size:var(--icon-md);font-weight:800;color:var(--c);line-height:1}
.sub .sn{flex:1;min-width:0;font-size:var(--fs-caption);color:var(--mut);font-weight:600;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub .sv{font-size:var(--fs-body);font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg)}
.sub .su{font-size:10px;color:var(--mut)}
@media(max-width:520px){.sub .su{display:none}}
@media(prefers-color-scheme:dark){:root:not([data-t=light]) .sub .si{color:var(--cd)}}
:root[data-t=dark] .sub .si{color:var(--cd)}

/* ── 页签（移动端：底部标签栏） ── */
/* [UX 升级] 动效时长统一走 Token（200~350ms 区间），并显式声明焦点行为 */
.pane{display:none;animation:fade var(--dur-base) var(--ease-std)}
.pane.on{display:block}
.pane:focus{outline:none}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.bar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
 background:none;border:0;color:var(--mut);font:inherit;font-size:var(--fs-caption);
 padding:var(--space-2) var(--space-1) 10px;cursor:pointer;line-height:1.3;
 transition:color var(--dur-fast) var(--ease-std)}
.bar button i{display:flex;align-items:center;justify-content:center;
 width:var(--icon-lg);height:var(--icon-lg);font-style:normal;
 transition:transform var(--dur-base) var(--ease-emph)}
.bar button.on{color:var(--acc);font-weight:700}
.bar button.on i{transform:translateY(-2px) scale(1.1)}

/* ── 通用卡片块 ── */
.blk{background:var(--surf);border:1px solid var(--line);border-radius:calc(var(--radius) * 1px);margin:14px 0;
 overflow:hidden;box-shadow:var(--sh)}
.blk-h{padding:12px 18px;font-size:12.5px;color:var(--fg);font-weight:700;
 border-bottom:1px solid var(--line);background:var(--surf2);display:flex;align-items:center}
.blk-h .ic{color:var(--c);font-weight:800;margin-right:8px;font-size:14px}
.blk-h .sep{margin:0 6px;opacity:.4;color:var(--mut)}
.blk-b{padding:4px 18px 16px}
.blk-b h3,.blk-b h4,.blk-b h5,.blk-b h6{font-size:14px;margin:14px 0 6px;font-weight:700}
.blk-b p{margin:8px 0;line-height:1.6}
.blk-b ul,.blk-b ol{margin:8px 0;padding-left:18px}
.blk-b li{margin:4px 0}
.blk-b hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.blk-b blockquote{margin:10px 0;padding:10px 14px;background:var(--surf2);
 border-left:3px solid var(--acc);border-radius:0 10px 10px 0;font-size:13px;color:var(--mut)}
.blk-b code{background:var(--surf2);padding:2px 6px;border-radius:6px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.blk-b pre{background:var(--surf2);padding:12px;border-radius:12px;overflow-x:auto;font-size:12px;line-height:1.5}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px -18px;padding:0 18px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:320px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:middle}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
th{background:var(--surf2);font-weight:700;color:var(--fg);white-space:nowrap}
tr:nth-child(even) td{background:color-mix(in srgb,var(--surf2) 40%,transparent)}

/* ── 遮罩自测效果 ── */
.mask-active td:nth-child(n+2):not(:last-child){filter:blur(6px);user-select:none;cursor:pointer;transition:filter var(--dur-base) var(--ease-std);background:color-mix(in srgb,var(--acc-sub) 30%,transparent)}
.mask-active td:nth-child(n+2):not(:last-child).revealed{filter:none;background:transparent}

/* ══ 空状态三件套（DESIGN.md §6.4：图标 + 说明 + CTA，禁止裸奔） ═══ */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;
 color:var(--mut);padding:var(--space-6) var(--space-4);font-size:var(--fs-body)}
.empty .ei{display:flex;align-items:center;justify-content:center;width:56px;height:56px;
 border-radius:50%;background:var(--surf2);color:var(--mut);margin-bottom:var(--space-3)}
.empty-t{font-size:var(--fs-body);font-weight:700;color:var(--fg);margin-bottom:var(--space-1)}
.empty-d{font-size:var(--fs-caption);color:var(--mut);line-height:1.6;max-width:34em}
.empty .cta{margin-top:var(--space-3)}
.empty-help{margin-top:var(--space-3);max-width:40em;text-align:left;
 font-size:var(--fs-caption);color:var(--mut);background:var(--surf2);
 border:1px solid var(--line);border-radius:calc(var(--radius-sm) * 1px);padding:var(--space-3)}
.empty-help[hidden]{display:none}
.empty-help b{color:var(--fg)}
.empty-help ol{margin:var(--space-2) 0 0;padding-left:1.3em}
.empty-help li{margin:var(--space-1) 0;line-height:1.6}
.empty-help code{background:var(--surf);padding:1px 5px;border-radius:5px;
 font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}

/* 主按钮（空状态 CTA）：DESIGN.md §6.2 主按钮 = acc 底 + on-acc 字 */
.cta{display:inline-flex;align-items:center;gap:var(--space-1);font:inherit;
 font-size:var(--fs-caption);font-weight:700;color:var(--on-acc);background:var(--acc);
 border:0;border-radius:99px;padding:var(--space-2) var(--space-4);cursor:pointer;
 box-shadow:var(--elev-1);transition:background var(--dur-fast) var(--ease-std)}
.cta:hover{background:var(--acc-hover)}
.cta .ic{display:flex}

.extra{margin:18px 0 8px}
.extra summary{cursor:pointer;font-size:12.5px;color:var(--mut);padding:10px 14px;
 background:var(--surf);border:1px solid var(--line);border-radius:12px;list-style:none;transition:background var(--dur-fast)}
.extra summary:hover{background:var(--surf2)}
.extra summary::-webkit-details-marker{display:none}
.extra[open] summary{border-radius:12px 12px 0 0;border-bottom:0}

/* ── 卡组选择 ── */
.decks{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;
 -webkit-overflow-scrolling:touch;scrollbar-width:none}
.decks::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surf);border:1px solid var(--line);border-radius:99px;
 padding:7px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;
 white-space:nowrap;transition:var(--dur-fast);box-shadow:var(--sh)}
.chip:hover{border-color:var(--acc)}
.chip .dot{width:6px;height:6px;border-radius:99px;background:var(--c)}
.chip .n{color:var(--mut);font-size:10.5px;font-variant-numeric:tabular-nums;background:var(--surf2);padding:1px 6px;border-radius:99px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.chip.on .dot{background:#fff}
.chip.on .n{background:rgba(255,255,255,.2);color:#fff}

/* ── 翻卡 ── */
.stage{perspective:1400px;margin:8px 0 14px}
.card{position:relative;width:100%;min-height:50vh;transform-style:preserve-3d;
 transition:transform var(--dur-slow) var(--ease-std);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 background:var(--surf);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh2);
 display:flex;flex-direction:column;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.f-top{display:flex;align-items:center;gap:8px;padding:14px 18px 0;font-size:11.5px;color:var(--mut)}
.f-top .tag{background:var(--acc);color:#fff;padding:3px 10px;border-radius:99px;font-weight:700;font-size:10.5px}
/* [前端修复·星标键盘可达] .hard 由 <span onclick> 改为 <button>：
   追加按钮复位样式，避免默认背景/边框/字体破坏既有外观。
   刻意不用 font:inherit —— 它会一并重置 font-size，覆盖上面的 16px。 */
.f-top .hard{margin-left:auto;font-size:16px;opacity:.35;cursor:pointer;transition:var(--dur-base);background:none;border:0;padding:0;font-family:inherit;color:inherit}
.f-top .hard.on{opacity:1;color:var(--warn);transform:scale(1.15)}
.f-body{flex:1;display:flex;align-items:center;justify-content:center;
 padding:18px 24px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.f-q{font-size:22px;font-weight:700;line-height:1.55;text-align:center;letter-spacing:-.01em}
.f-a{width:100%;font-size:14.5px}
.f-a .row{padding:10px 0;border-bottom:1px solid var(--line)}
.f-a .row:last-child{border-bottom:0}
.f-a .k{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;
 margin-bottom:4px;font-weight:700}
.f-a .v{line-height:1.65;word-break:break-word}
.f-hint{text-align:center;font-size:11px;color:var(--mut);padding:0 0 12px;opacity:.7}

/* ── 卡片控制 ── */
.ctrl{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nav{flex:0 0 auto;width:42px;height:42px;border-radius:99px;background:var(--surf);
 border:1px solid var(--line);color:var(--fg);font-size:18px;cursor:pointer;box-shadow:var(--sh);
 display:flex;align-items:center;justify-content:center;transition:var(--dur-fast)}
.nav:hover{background:var(--surf2)}
.nav:active{transform:scale(.94)}
.nav:disabled{opacity:.3;cursor:default}
.meter{flex:1}
.meter .mt{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);
 margin-bottom:5px;font-variant-numeric:tabular-nums;font-weight:600}
.mtrack{height:5px;background:var(--surf2);border-radius:99px;overflow:hidden}
.mfill{height:100%;background:var(--acc);border-radius:99px;transition:width var(--dur-base) var(--ease-std)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tbtn{background:var(--surf);border:1px solid var(--line);color:var(--fg);border-radius:99px;
 padding:6px 14px;font:inherit;font-size:12px;cursor:pointer;box-shadow:var(--sh);transition:var(--dur-fast);display:flex;align-items:center;gap:5px}
.tbtn:hover{background:var(--surf2)}
.tbtn:active{transform:scale(.96)}
.tbtn.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}

/* ── 指标条 ── */
.mgrp{background:var(--surf);border:1px solid var(--line);border-radius:calc(var(--radius) * 1px);margin:14px 0;
 padding:14px 18px 8px;box-shadow:var(--sh)}
.mgrp h3{margin:0 0 12px;font-size:12.5px;color:var(--mut);font-weight:700;
 display:flex;align-items:center;gap:7px}
.mgrp h3 .ic{color:var(--c);font-weight:800}
.mgrp h3 .sep{opacity:.4}
.mi{margin-bottom:14px}
.mi .ml{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.mi .mn{font-size:13.5px;font-weight:600;line-height:1.35}
.mi .mv{font-size:12.5px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.mi .mv b{font-size:14.5px;color:var(--fg);font-weight:800}
.mtk{position:relative;height:8px;background:var(--surf2);border-radius:99px;overflow:visible;border:1px solid var(--line)}
.mfl{height:100%;border-radius:99px;width:0;transition:width var(--dur-slow) var(--ease-std)}
.mfl.good{background:linear-gradient(90deg,var(--ok),#34d399)}
.mfl.mid{background:linear-gradient(90deg,var(--warn),#fde047)}
.mfl.bad{background:linear-gradient(90deg,var(--bad),#fda4af)}
.mfl.neu{background:var(--acc)}
.tick{position:absolute;top:-3px;width:2px;height:14px;background:var(--fg);opacity:.4;border-radius:2px}
.tick::after{content:attr(data-l);position:absolute;top:-14px;left:50%;transform:translateX(-50%);
 font-size:9px;color:var(--mut);white-space:nowrap;opacity:.85}
.leg{display:flex;gap:16px;font-size:11px;color:var(--mut);padding:4px 0 10px;flex-wrap:wrap}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ── 知识图谱 (S3-4) ── */
.map-summary{background:var(--surf);border:1px solid var(--line);border-radius:calc(var(--radius) * 1px);padding:14px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.map-badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.mbadge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.mbadge.A{background:rgba(16,185,129,.12);color:var(--ok);border:1px solid rgba(16,185,129,.3)}
.mbadge.B{background:rgba(59,130,246,.12);color:#3b82f6;border:1px solid rgba(59,130,246,.3)}
.mbadge.C{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.mbadge.D{background:rgba(239,68,68,.12);color:var(--bad);border:1px solid rgba(239,68,68,.3)}
.mbadge.U{background:rgba(148,163,184,.12);color:#64748b;border:1px solid rgba(148,163,184,.35)}
.map-chap{background:var(--surf);border:1px solid var(--line);border-radius:calc(var(--radius) * 1px);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
.map-chap-h{padding:12px 18px;font-weight:700;font-size:13.5px;background:var(--surf2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.map-point{padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.map-point:last-child{border-bottom:0}
.map-point-l{display:flex;align-items:center;gap:8px;flex:1}
.map-req{font-size:10.5px;color:var(--mut);background:var(--surf2);padding:2px 6px;border-radius:4px}
.map-err{font-size:11px;color:var(--bad);font-weight:600}

/* ── 趋势曲线 (S3-4) ── */
.trend-card{background:var(--surf);border:1px solid var(--line);border-radius:calc(var(--radius) * 1px);padding:14px 18px;margin-bottom:16px;box-shadow:var(--sh)}
.trend-card h3{margin:0 0 10px;font-size:13px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}

/* ── 招考与考纲变动雷达 (S7) ── */
.radar-sec{background:var(--surf);border:1px solid var(--line);border-radius:calc(var(--radius) * 1px);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.radar-sec h3{margin:0 0 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--fg)}
.radar-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.radar-badge.add{background:rgba(239,68,68,.12);color:var(--bad);border:1px solid rgba(239,68,68,.25)}
.radar-badge.del{background:rgba(16,185,129,.12);color:var(--ok);border:1px solid rgba(16,185,129,.25)}
.radar-badge.mod{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.25)}
.radar-badge.tag{background:var(--surf2);color:var(--mut);border:1px solid var(--line)}
.radar-card{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.radar-card-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;margin-bottom:6px}
.radar-stat{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;margin:8px 0}

footer{text-align:center;color:var(--mut);font-size:var(--fs-caption);padding:var(--space-5) 0 var(--space-3);opacity:.7}

/* ══════════════════════════════════════════════════════════════════
   以下为**响应式覆盖段，必须留在 <style> 末尾**：
   基础（移动优先）规则写在前部，桌面规则靠后覆盖。
   顺序一旦反过来，就会出现 P1 根因那种「桌面规则被基础规则吃掉」的
   反向覆盖（.wrap 宽度上限、.bar button 巨型激活块都由它引起）。
   ══════════════════════════════════════════════════════════════════ */

/* ── 平板（≥768px）─────────────────────────────────────────────── */
@media(min-width:768px){
  .sidebar{top:0;bottom:auto;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  .bar{padding:0 var(--space-5);border-top:none;border-bottom:1px solid var(--line)}
  .wrap{padding:0 var(--space-5)}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* ── 桌面（≥1100px）：左侧栏 + 12 栏网格 ─────────────────────────
   阈值取 1100px 而非 1024px：240px 侧栏 + 内容区在 1024px 下只剩 784px，
   四张 KPI 卡会被压到约 180px。 */
@media(min-width:1100px){
  .sidebar{top:0;bottom:0;right:auto;width:var(--sbw);display:flex;flex-direction:column;
   gap:var(--space-5);padding:var(--space-5) var(--space-3);
   background:var(--surf);border-right:1px solid var(--line);border-bottom:none;
   box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  /* 品牌区（DESIGN.md §6.3：导航分组之上） */
  .brand{display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-2)}
  .brand-mark{display:flex;flex:0 0 auto;align-items:center;justify-content:center;
   width:36px;height:36px;border-radius:calc(var(--radius-sm) * 1px);
   background:var(--acc-grad);color:var(--on-acc);box-shadow:var(--elev-1)}
  .brand-txt{min-width:0}
  .brand-txt b{display:block;font-size:var(--fs-body);font-weight:800;
   letter-spacing:-.01em;line-height:1.25}
  .brand-txt small{display:block;font-size:var(--fs-caption);color:var(--mut)}
  /* 页签改侧栏导航：标准 40px pill + 左侧 3px 强调条（禁止整块巨型高亮） */
  .bar{flex-direction:column;gap:var(--space-2);padding:0;
   background:transparent;border:0;box-shadow:none;
   backdrop-filter:none;-webkit-backdrop-filter:none}
  .bar button{flex:none;width:100%;height:40px;flex-direction:row;justify-content:flex-start;
   gap:var(--space-3);padding:0 var(--space-3);border-left:3px solid transparent;
   border-radius:calc(var(--radius-sm) * 1px);font-size:var(--fs-body);text-align:left}
  .bar button:hover{background:var(--surf2)}
  .bar button i{width:var(--icon-lg);margin:0}
  .bar button.on{background:var(--acc-sub);color:var(--acc);font-weight:700;
   border-left-color:var(--acc)}
  .bar button.on i{transform:none}
  .wrap{margin-left:var(--sbw);width:calc(100% - var(--sbw));
   padding:var(--space-5) var(--space-6) var(--space-6)}
  body{padding-bottom:var(--space-5)}
  /* 12 栏网格：hero 占 7 栏、KPI 2×2 占 5 栏，首屏一屏内主次分明 */
  .dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
   gap:var(--space-4);align-items:start}
  .hero{grid-column:span 7}
  .kpis{grid-column:span 5;grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-in{flex-wrap:nowrap}
  .hero-ring{width:132px;height:132px}
}
</style>
</head>
<body>
<!-- ── 图标 sprite（构建期把 docs/assets/icons.svg 全文注入） ──────────
     必须内联：<use href="#i-today"> 只认同文档内的 symbol，而 file:// 下
     跨文件 <use href="assets/icons.svg#..."> 会被浏览器同源策略拒绝。
     build.py 是单遍 re.sub，注入内容不会被再次扫描，故 sprite 里的任何
     字符都不会被误当占位符。 -->
{{ICON_SPRITE}}
<a class="skip-link" href="#main">跳到主要看板内容</a>
<!-- 屏幕阅读器播报区：页签切换等状态变化在此播报（视觉不可见） -->
<div id="a11y-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<aside class="sidebar">
  <!-- 品牌区（桌面侧栏顶部；移动端底栏无空间，CSS 里隐藏） -->
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg class="icn" width="20" height="20" focusable="false"><use href="#i-cap"/></svg></span>
    <span class="brand-txt"><b>考研学习链</b><small>四科备考中枢</small></span>
  </div>
  <nav class="bar" role="tablist" aria-label="看板页签">
    <button role="tab" id="tab-today" aria-controls="p-today" aria-selected="true" tabindex="0" class="on" data-p="today"><i class="ic"><svg class="icn" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-today"/></svg></i>今日</button>
    <button role="tab" id="tab-memo" aria-controls="p-memo" aria-selected="false" tabindex="-1" data-p="memo"><i class="ic"><svg class="icn" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-memo"/></svg></i>必背</button>
    <button role="tab" id="tab-weak" aria-controls="p-weak" aria-selected="false" tabindex="-1" data-p="weak"><i class="ic"><svg class="icn" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-weak"/></svg></i>薄弱</button>
    <button role="tab" id="tab-stat" aria-controls="p-stat" aria-selected="false" tabindex="-1" data-p="stat"><i class="ic"><svg class="icn" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-stats"/></svg></i>数据</button>
    <button role="tab" id="tab-map" aria-controls="p-map" aria-selected="false" tabindex="-1" data-p="map"><i class="ic"><svg class="icn" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-map"/></svg></i>图谱</button>
    <button role="tab" id="tab-radar" aria-controls="p-radar" aria-selected="false" tabindex="-1" data-p="radar"><i class="ic"><svg class="icn" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-radar"/></svg></i>考情</button>
  </nav>
</aside>

<div class="wrap">

<div class="topbar">
  <button class="tbtn-theme" id="th-btn" type="button" aria-label="切换主题预设" title="点击切换主题预设"><span class="ic" id="th-ic"><svg class="icn" width="14" height="14" aria-hidden="true" focusable="false"><use href="#i-sun"/></svg></span><span class="th-name">主题</span></button>
  <!-- [UX 升级] 原为可点击 div：键盘不可达、读屏不识别为控件。
       改为 <button> 并同步 aria-pressed，使其可 Tab 聚焦、Enter/Space 激活。 -->
  <button class="fx-btn" type="button" id="fx-toggle" aria-pressed="true"><span class="ic"><svg class="icn" width="14" height="14" aria-hidden="true" focusable="false"><use href="#i-sparkles"/></svg></span><span class="fx-name">动效已开启</span></button>
</div>

<main id="main" tabindex="-1">
<div class="dash">
<header class="hero">
  <h1 class="sr-only">考研学习看板 · 距初试还有 {{DDAY1}} 天</h1>
  <div class="hero-in">
    <div class="hero-ring" role="img" aria-label="备考日程已推进 {{PLANPCT}}%，距初试还有 {{DDAY1}} 天">
      <!-- 环形进度：pathLength=100 把周长归一到 100，dashoffset 由 animate() 按
           {{PLANPCT}} 设置（进度 = 备考天数 / 总天数） -->
      <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
        <circle class="ring-track" cx="60" cy="60" r="52"/>
        <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="52" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      </svg>
      <div class="hero-ring-c" aria-hidden="true"><span class="hero-num">{{DDAY1}}</span><span class="hero-unit">天</span></div>
    </div>
    <div class="hero-info">
      <div class="hero-lb"><span class="ic"><svg class="icn" width="14" height="14" aria-hidden="true" focusable="false"><use href="#i-clock"/></svg></span>{{EXAM_YEAR}} 研考倒计时</div>
      <!-- [前端修复·考期硬编码] 原写死「12-19」，改由 EXAM_MMDD 注入 -->
      <div class="hero-title">初试首日 · <b>{{EXAM_MMDD}}</b></div>
      <div class="hero-meta">备考第 <b>{{DAYNO}}</b> / {{TOTALDAYS}} 天</div>
      <div class="plan">
        <div class="pt"><span>备考总日程推进</span><span>{{PLANPCT}}%</span></div>
        <div class="ptrack"><div class="pfill" id="pf" style="width:0"></div></div>
      </div>
    </div>
  </div>
  <div class="hero-subs" id="subs"></div>
</header>

<section class="kpis" id="kpis" aria-label="近 7 日学习概况"></section>
</div>

<div id="p-today" class="pane on" role="tabpanel" aria-labelledby="tab-today" tabindex="-1">
  <section class="panel">
    <div class="panel-h">
      <span class="ic"><svg class="icn" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-clipboard"/></svg></span>

<script>
var D = {{DATA}};

{{FALLBACK_MATH_JS}}

function tex(el){
  if(!el) return;
  if(typeof renderMathInElement === 'function'){
    try{
      renderMathInElement(el,{
        delimiters:[
          {left:'$$',right:'$$',display:true},
          {left:'$',right:'$',display:false}
        ],
        throwOnError:false,
        trust:false,
        errorColor:'#f87171'
      });
      return;
    }catch(e){console.warn('KaTeX render warning, fallback to Unicode:', e);}
  }
  fallbackMathUnicode(el);
}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
/* 图标统一走内联 sprite（symbol 定义由构建期注入的图标片段提供，见本页头部）。
   禁止再用 emoji：跨平台字形不一致、无法随主题换色（DESIGN.md §4）。
   [缺陷修复·sprite 二次注入] 此处原先写有字面量占位符名，而 build() 是
   「单遍 re.sub 全文替换」——它不认识注释，于是把整份 sprite（约 15KB XML）
   又注了一遍进这个 JS 注释里：产物体积白白翻倍，且 sprite 内容一旦出现
   注释终止序列，整个 <script> 块会被提前截断、全页交互报废。
   故本注释内不得再出现带花括号的占位符名（写进来就会被替换成整份 sprite）。
   容器一律用 <span class="ic"> 包住 <svg>：check_dashboard 的运行时探针会
   断言每个 .ic 容器内部真的渲染出了 <svg>（防「图标被转义成裸文本」）。 */
function iconHtml(name,size){
  size=size||18;
  return "<svg class='icn' width='"+size+"' height='"+size+"' aria-hidden='true' focusable='false'><use href='#i-"+name+"'/></svg>";
}
function iconBox(name,size){
  return "<span class='ic'>"+iconHtml(name,size)+"</span>";
}
function isDark(){
  var a=document.documentElement.getAttribute('data-t');
  /* 明暗必须查 KY_MODE 而不是写死 t==='dark'：新增的护眼绿/樱粉是浅色、
     高对比是深色，写死会让这两个预设下的图表与强调色整体错位。 */
  if(a&&KY_MODE[a]!==undefined) return KY_MODE[a]==='dark';
  return matchMedia('(prefers-color-scheme:dark)').matches;
}
function col(o){return isDark()?(o.dark||o.color):(o.color||'#4f46e5');}

/* 遮罩自测按钮的眼睛图标（sprite）。注意必须经 innerHTML 注入，
   直接写 HTML 字符串时引号需成对，否则整个 <script> 块会 SyntaxError。 */
var MASK_EYE_HTML = iconBox('eye',14);

/* ── 主题切换（5 套预设轮换；未手动选择时按备考节律给出默认） ── */
(function(){
  var tb=document.getElementById('th-btn');
  if(!tb) return;
  var nameEl=tb.querySelector('.th-name'), icEl=document.getElementById('th-ic');
  function idxOf(k){
    for(var i=0;i<KY_PRESETS.length;i++){if(KY_PRESETS[i].k===k) return i;}
    return 0;
  }
  function apply(i,save){
    var p=KY_PRESETS[i];
    document.documentElement.setAttribute('data-t',p.k);
    if(save){try{localStorage.setItem('kytheme',p.k);}catch(e){}}
    var tip='当前：'+p.n+(KY_RHYTHM.label?'（距初试 '+KY_RHYTHM.days+' 天 · '+KY_RHYTHM.label+'）':'');
    tb.setAttribute('title',tip+'　点击切换到下一套');
    tb.setAttribute('aria-label','当前主题 '+p.n+'，点击切换到下一套');
    if(nameEl) nameEl.textContent=p.n;
    /* 图标随当前预设的明暗切换（sun/moon），不再是一个写死的装饰图标 */
    if(icEl) icEl.innerHTML=iconHtml(p.m==='dark'?'moon':'sun',14);
  }
  var cur=document.documentElement.getAttribute('data-t')||KY_RHYTHM.p;
  apply(idxOf(cur),false);
  tb.onclick=function(){
    var now=document.documentElement.getAttribute('data-t')||KY_RHYTHM.p;
    apply((idxOf(now)+1)%KY_PRESETS.length,true);
  };
})();

(function(){
  var h='';
  D.subjects.forEach(function(s){
    var v = s.notes===null ? '—' : s.notes;
    h += "<div class='sub' style='--c:"+s.color+";--cd:"+s.dark+"'>"

       + "<div class='sn'>"+esc(s.name)+"</div>"
       + "<div class='sv'>"+v+"</div>"
       + "<div class='su'>"+(s.notes===null?'规划中':'篇归档')+"</div></div>";

/* ── 遮罩自测逻辑 ── */
(function(){
  function bindMask(btnId, containerId){
    var btn=document.getElementById(btnId);
    var pane=document.getElementById(containerId);
    if(!btn || !pane) return;
    btn.onclick=function(){

/* ── 闪卡引擎 ── */
function Flash(tab){
  var decks=D[tab]||[], self=this;
  this.tab=tab; this.di=0; this.ci=0; this.shuffled=false; this.onlyHard=false;
  this.order=[];
  var KEY='ky-hard-'+tab;
  try{ this.hard=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ this.hard={}; }
  this.saveHard=function(){ try{localStorage.setItem(KEY,JSON.stringify(self.hard));}catch(e){} };

  this.deck=function(){ return decks[self.di]; };
  this.key=function(i){ return self.di+':'+i; };

  this.rebuild=function(){
    var d=self.deck(); if(!d){self.order=[];return;}
    var idx=d.cards.map(function(_,i){return i;});
    if(self.onlyHard) idx=idx.filter(function(i){return self.hard[self.key(i)];});
    if(self.shuffled) for(var i=idx.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idx[i];idx[i]=idx[j];idx[j]=t;}
    self.order=idx; if(self.ci>=idx.length) self.ci=0;
  };

  this.chips=function(){
    var el=document.getElementById('dk-'+tab); if(!el) return;
    if(!decks.length){el.innerHTML='';return;}
    el.innerHTML=decks.map(function(d,i){
      return "<div class='chip"+(i===self.di?' on':'')+"' data-i='"+i+"' style='--c:"+col(d)+"'>"
           + "<span class='dot'></span>"+esc(d.subj)+" · "+esc(d.title)
           + "<span class='n'>"+d.cards.length+"</span></div>";
    }).join('');
    el.querySelectorAll('.chip').forEach(function(c){
      c.onclick=function(){ self.di=+c.dataset.i; self.ci=0; self.rebuild(); self.chips(); self.render(); };
    });
  };

  this.render=function(){
    var host=document.getElementById('fc-'+tab); if(!host) return;
    var d=self.deck();
    if(!d){ host.innerHTML="<div class='empty'><div class='ei'>"+iconHtml('book',24)+"</div><div class='empty-t'>暂无卡片数据</div><div class='empty-d'>在 _状态/ 中完善表格后会自动生成卡片</div></div>"; return; }
    if(!self.order.length){
      host.innerHTML="<div class='tools'>"+self.toolsHtml()+"</div>"
        +"<div class='empty'><div class='ei'>"+iconHtml('star',24)+"</div><div class='empty-t'>暂无标记难点</div><div class='empty-d'>翻卡时点击右上角星号标记</div></div>";
      self.bindTools(); return;
    }
    var i=self.order[self.ci], c=d.cards[i], C=col(d);
    var hard=!!self.hard[self.key(i)];
    var back=c.b.map(function(kv){
      return "<div class='row'><div class='k'>"+esc(kv[0])+"</div><div class='v'>"+esc(kv[1])+"</div></div>";
    }).join('');
    /* [UX 升级 · 修"空壳卡片"] 默认（脱敏）构建下每张卡的背面 b 都被清空，
       旧实现仍然渲染翻转卡与"答案解析"标签 → 用户点开一看是空白背面，
       表现为"功能坏了"。此处：无背面内容时不再渲染翻转交互，
       改为静态卡并明确说明原因，避免"点了没反应"的挫败感。 */
    var hasBack = !!(c.b && c.b.length);

    host.innerHTML =
      "<div class='tools'>"+self.toolsHtml()+"</div>"
    + "<div class='ctrl'>"
    +   "<button class='nav' id='pv-"+tab+"' aria-label='上一张'>‹</button>"
    +   "<div class='meter' style='--c:"+C+"'><div class='mt'><span>"+esc(d.title)+"</span>"
    +     "<span>"+(self.ci+1)+" / "+self.order.length+"</span></div>"
    +     "<div class='mtrack'><div class='mfill' style='width:"+((self.ci+1)/self.order.length*100)+"%'></div></div></div>"
    +   "<button class='nav' id='nx-"+tab+"' aria-label='下一张'>›</button>"
    + "</div>"
    + "<div class='stage'><div class='card"+(hasBack?'':' noback')+"' id='cd-"+tab+"' style='--c:"+C+"'>"
    +   "<div class='face'>"
    +     "<div class='f-top'><span class='tag'>"+esc(d.subj)+"</span><span>"+esc(d.title)+"</span>"
    +       "<button type='button' class='hard"+(hard?' on':'')+"' id='hd-"+tab+"' aria-pressed='"+(hard?'true':'false')+"' aria-label='标记为难点'>"+iconHtml('star',16)+"</button></div>"
    +     "<div class='f-body'><div class='f-q'>"+esc(c.f)+"</div></div>"
    +     "<div class='f-hint'>"+(hasBack?'点击翻转卡片 · 左右轻扫切换':'答案解析已脱敏 · 本地完整模式可见')+"</div>"
    +   "</div>"
    +   (hasBack
        ? ("<div class='face back'>"
           + "<div class='f-top'><span class='tag'>答案解析</span><span>"+esc(d.title)+"</span></div>"
           + "<div class='f-body'><div class='f-a'>"+back+"</div></div>"
           + "<div class='f-hint'>再次点击返回卡片正面</div>"
           + "</div>")
        : "")
    + "</div></div>";

    var card=document.getElementById('cd-'+tab);
    if(card && hasBack) card.onclick=function(e){ if(e.target.id==='hd-'+tab) return; card.classList.toggle('flip'); if(card.classList.contains('flip') && Math.random()>0.8) fireConfetti(); };
    var hd=document.getElementById('hd-'+tab);
    if(hd) hd.onclick=function(e){
      e.stopPropagation();
      var k=self.key(i);
      if(self.hard[k]) delete self.hard[k]; else self.hard[k]=1;
      /* [前端修复·星标键盘可达] 同步 aria-pressed 状态（render() 会重建节点，
         此处仍显式更新，保证任何渲染路径下状态一致） */
      hd.setAttribute('aria-pressed', self.hard[k] ? 'true' : 'false');
      self.saveHard(); self.render();
    };
    var pv=document.getElementById('pv-'+tab);
    if(pv) pv.onclick=function(){ self.go(-1); };
    var nx=document.getElementById('nx-'+tab);
    if(nx) nx.onclick=function(){ self.go(1); };
    if(card) self.swipe(card);
    self.bindTools();
    tex(host);
  };

  this.toolsHtml=function(){
    var n=Object.keys(self.hard).filter(function(k){return k.indexOf(self.di+':')===0;}).length;
    return "<button class='tbtn"+(self.shuffled?' on':'')+"' id='sf-"+self.tab+"'>"+iconBox('refresh',14)+"随机打乱</button>"
         + "<button class='tbtn"+(self.onlyHard?' on':'')+"' id='oh-"+self.tab+"'>"+iconBox('star',14)+"重点难点 "+(n?'('+n+')':'')+"</button>"
         + "<button class='tbtn' id='rs-"+self.tab+"'>"+iconBox('refresh',14)+"从头开始</button>";
  };
  this.bindTools=function(){
    var a=document.getElementById('sf-'+self.tab),b=document.getElementById('oh-'+self.tab),c=document.getElementById('rs-'+self.tab);
    if(a)a.onclick=function(){self.shuffled=!self.shuffled;self.ci=0;self.rebuild();self.render();};
    if(b)b.onclick=function(){self.onlyHard=!self.onlyHard;self.ci=0;self.rebuild();self.render();};
    if(c)c.onclick=function(){self.ci=0;self.rebuild();self.render();};
  };

  this.go=function(step){
    if(!self.order.length) return;
    self.ci=(self.ci+step+self.order.length)%self.order.length;
    self.render();
  };

  this.swipe=function(el){
    var x0=null,y0=null;
    el.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
    el.addEventListener('touchend',function(e){
      if(x0===null)return;
      var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
      if(Math.abs(dx)>52 && Math.abs(dx)>Math.abs(dy)*1.4){ self.go(dx<0?1:-1); }
      x0=y0=null;
    },{passive:true});
  };

  this.init=function(){ self.rebuild(); self.chips(); self.render(); };
}

var FM=new Flash('memo'), FW=new Flash('weak');
FM.init(); FW.init();

/* ── 指标进度条 ── */
(function(){
  var host=document.getElementById('stat');
  if(!host) return;
  if(!D.metrics.length){ host.innerHTML="<div class='empty'><div class='ei'>"+iconHtml('stats',24)+"</div><div class='empty-t'>暂无可视化指标数据</div><div class='empty-d'>在薄弱点雷达中记录错因即可生成</div></div>"; return; }
  var h='';
  D.metrics.forEach(function(g){

    h+="<div class='mgrp' style='--c:"+C+"'><h3><span class='ic'>"+g.icon+"</span>"
      +esc(g.subj)+(g.title?("<span class='sep'>·</span>"+esc(g.title)):"")+"</h3>";
    g.items.forEach(function(it){

          var near = it.dir==='lower' ? (pct<=it.target*1.35) : (pct>=it.target*0.8);
          cls = ok?'good':(near?'mid':'bad');
          tick="<div class='tick' style='left:"+Math.min(it.target,99)+"%' data-l='目标'></div>";
        }else{
          cls = pct>=75?'good':(pct>=50?'mid':'bad');
        }
      }else if(it.count!==undefined){
        w=Math.min(it.count*10,100); cls='neu';
      }
      h+="<div class='mi'><div class='ml'><span class='mn'>"+esc(it.label)+"</span>"
        +"<span class='mv'><b>"+esc(it.text)+"</b>"+(it.target!==undefined?" / 目标 "+it.target+"%":"")+"</span></div>"
        +"<div class='mtk'>"+tick+"<div class='mfl "+cls+"' data-w='"+w+"'></div></div></div>";
    });
    h+="</div>";
  });
  host.innerHTML=h;
})();

function animate(){
  var pf=document.getElementById('pf');
  if(pf) pf.style.width='{{PLANPCT}}%';
  /* hero 环形进度：pathLength=100 → dashoffset = 100 - 进度百分比。
     进度即「备考天数 / 总天数」，与进度条、{{PLANPCT}} 同源。 */
  var rf=document.getElementById('ring-fill');
  if(rf) rf.style.strokeDashoffset=String(100-Math.max(0,Math.min(100,{{PLANPCT}})));
  document.querySelectorAll('#stat .mfl').forEach(function(el,i){
    setTimeout(function(){ el.style.width=el.dataset.w+'%'; }, 40+i*22);
  });
  /* [前端修复·趋势图字号缩放] 切到「数据」页签时 #p-stat 已可见，此处按容器
     真实宽度重绘趋势图（首次隐藏态渲染回落 480 的那次会被本次覆盖）。
     renderTrend 为函数声明，已提升，可在此安全调用。 */
  renderTrend();
}

/* ── 趋势曲线 SVG (S3-4) ── */
/* [前端修复·趋势图字号缩放] 原为一次性 IIFE + 固定 viewBox 宽 480 配 CSS width:100%：
   390px 手机上整体缩到 0.81 倍，10px 字号实际仅约 8.1px（不可读）；宽屏又被放大失真。
   改为顶层具名函数 renderTrend()，按容器实宽设置 viewBox 宽（缩放比≈1:1 → 字号恒定）；
   隐藏页签（#p-stat 默认 display:none）下 clientWidth 为 0，回落 480。
   函数声明会提升，故定义在前面的 animate() 可直接调用，无需调整声明顺序。 */
function renderTrend(){
  var host=document.getElementById('stat-trend');
  if(!host) return;
  var trend = D.trend || [];
  if(!trend.length){
    host.innerHTML = "<div class='trend-card'><h3>"+iconBox('trend-up',16)+"近 7 日完成率趋势</h3><div style='font-size:var(--fs-caption);color:var(--mut);text-align:center;padding:var(--space-3) 0;'>暂无历史打卡记录，坚持复习将在此汇聚成长曲线。</div></div>";
    return;
  }
  /* [前端修复·趋势图字号 1:1] 先落卡片骨架，再量「卡片内容盒」宽度作为 viewBox 宽。
     直接量 host.clientWidth 会高估约 38px（.trend-card 的左右内边距 36px + 边框 2px），
     于是 viewBox 宽 > SVG 实际渲染宽 → 整体仍被等比缩小，字号继续随视口漂移。
     .trend-slot 是纯块级 div，宽度天然等于卡片内容盒宽度，无需新增 CSS。 */
  if(!host.querySelector('.trend-card')){
    host.innerHTML = "<div class='trend-card'><h3>"+iconBox('trend-up',16)+"近 7 日任务完成率趋势 (Trend)</h3><div class='trend-slot'></div></div>";
  }
  var slot = host.querySelector('.trend-slot');
  if(!slot) return;
  var w = Math.max(280, Math.round(slot.clientWidth) || 480), h = 120, padL = 36, padR = 24, padT = 20, padB = 28;
  var chartW = w - padL - padR, chartH = h - padT - padB;
  var n = trend.length;
  var pts = [];
  trend.forEach(function(d, i){
    var x = padL + (n === 1 ? chartW / 2 : (i / (n - 1)) * chartW);
    var y = padT + (1 - (Math.min(100, Math.max(0, d.rate)) / 100)) * chartH;
    pts.push({x: x, y: y, rate: d.rate, date: d.short_date || d.date});
  });
  var pathD = pts.map(function(p, i){ return (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
  var areaD = pathD + ' L' + pts[pts.length-1].x.toFixed(1) + ',' + (padT + chartH) + ' L' + pts[0].x.toFixed(1) + ',' + (padT + chartH) + ' Z';
  
  var svg = "<svg viewBox='0 0 " + w + " " + h + "' style='width:100%;height:auto;overflow:visible'>"
    + "<defs><linearGradient id='tg' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='var(--acc)' stop-opacity='0.35'/><stop offset='100%' stop-color='var(--acc)' stop-opacity='0.0'/></linearGradient></defs>"
    + "<line x1='" + padL + "' y1='" + (padT + chartH) + "' x2='" + (padL + chartW) + "' y2='" + (padT + chartH) + "' stroke='var(--line)' stroke-width='1'/>"
    + "<line x1='" + padL + "' y1='" + (padT + chartH/2) + "' x2='" + (padL + chartW) + "' y2='" + (padT + chartH/2) + "' stroke='var(--line)' stroke-width='1' stroke-dasharray='3,3'/>"
    + "<text x='" + (padL - 6) + "' y='" + (padT + 4) + "' font-size='9' fill='var(--mut)' text-anchor='end'>100%</text>"
    + "<text x='" + (padL - 6) + "' y='" + (padT + chartH/2 + 3) + "' font-size='9' fill='var(--mut)' text-anchor='end'>50%</text>"
    + "<path d='" + areaD + "' fill='url(#tg)'/>"
    + "<path d='" + pathD + "' fill='none' stroke='var(--acc)' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/>";
  
  pts.forEach(function(p){
    svg += "<circle cx='" + p.x.toFixed(1) + "' cy='" + p.y.toFixed(1) + "' r='3.5' fill='var(--surf)' stroke='var(--acc)' stroke-width='2'/>"
         + "<text x='" + p.x.toFixed(1) + "' y='" + (p.y - 7).toFixed(1) + "' font-size='10' font-weight='700' fill='var(--fg)' text-anchor='middle'>" + Math.round(p.rate) + "%</text>"
         + "<text x='" + p.x.toFixed(1) + "' y='" + (h - 8) + "' font-size='10' fill='var(--mut)' text-anchor='middle'>" + p.date + "</text>";
  });
  svg += "</svg>";
  slot.innerHTML = svg;
}

/* ── 近 7 日 KPI 卡（含 7 日 sparkline） ───────────────────────────
   [P1 首屏] 四张卡：完成率 / 完成任务 / 计划任务 / 待办积压。
   每张 = 指标名 + 数值 + 7 日 sparkline（内联 SVG polyline）+ 一句上下文
   （「给数字配上下文」）；无任何打卡记录时走空状态三件套（图标/说明/CTA）。
   数据全部取自内联的 D.trend（ky_config.json 的 completion_history），
   不新增构建期占位符。上下文一律带**真实日期**：trend 的最后一条未必是
   昨天（学员可能断更数日），写死「昨日」会给出错误信息。 */
(function(){
  var host=document.getElementById('kpis');
  if(!host) return;
  var tr=(D.trend||[]).slice().sort(function(a,b){
    return String(a.date||'')<String(b.date||'')?-1:1;
  });
  function n(v){ v=Number(v); return isFinite(v)?v:0; }
  function pct(v){ return Math.max(0,Math.min(100,n(v))); }
  function sum(a){ return a.reduce(function(s,v){ return s+n(v); },0); }
  function avg(a){ return a.length?sum(a)/a.length:0; }
  function day(d){ return d && (d.short_date||String(d.date||'').slice(5)) || ''; }

  var series={
    rate: tr.map(function(d){ return pct(d.rate); }),
    done: tr.map(function(d){ return n(d.completed); }),
    plan: tr.map(function(d){ return n(d.total); }),
    left: tr.map(function(d){ return Math.max(0,n(d.total)-n(d.completed)); })
  };
  var last=tr.length?tr[tr.length-1]:null;
  var prev=tr.length>1?tr[tr.length-2]:null;

  /* 7 日 sparkline：polyline + preserveAspectRatio=none 横向拉伸铺满卡片；
     vector-effect=non-scaling-stroke 让描边不随拉伸变粗变细。
     只有一个数据点时画不出线，退化为一条虚线基线（不假装有趋势）。 */
  function spark(vals){
    var w=100,h=28,pad=4;
    var open="<svg class='spark' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none' aria-hidden='true' focusable='false'>";
    if(vals.length<2){
      return open+"<line class='spark-base' x1='0' y1='"+(h/2)+"' x2='"+w+"' y2='"+(h/2)+"'/></svg>";
    }
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), span=(mx-mn)||1;
    var pts=vals.map(function(v,i){
      var x=i/(vals.length-1)*w;
      var y=h-pad-((v-mn)/span)*(h-pad*2);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return open+"<polyline points='"+pts+"' fill='none' stroke='currentColor' stroke-width='2'"
         + " vector-effect='non-scaling-stroke' stroke-linecap='round' stroke-linejoin='round'/></svg>";
  }

  function card(o){
    var head="<div class='kpi-h'>"+iconBox(o.icon,16)+esc(o.label)+"</div>";
    var body;
    if(!last){
      body="<div class='kpi-empty'><div class='ed'>"+esc(o.empty)+"</div>"
         + "<button class='cta' type='button' data-goto='today'>去完成今日任务</button></div>";
    }else{
      body="<div class='kpi-v'>"+o.value+"<span class='u'>"+o.unit+"</span></div>"
         + "<div class='kpi-spark'>"+spark(o.series)+"</div>"
         + "<div class='kpi-ctx "+o.tone+"'>"+o.ctx+"</div>";
    }
    return "<div class='kpi' style='--c:var(--chart-"+o.ci+")'>"+head+body+"</div>";
  }

  var cards=[];
  if(!last){
    cards=[
      {ci:1,icon:'trend-up',label:'近 7 日完成率',empty:'打卡 2 天后生成趋势曲线'},
      {ci:2,icon:'check-circle',label:'完成任务',empty:'完成今日任务后开始统计'},
      {ci:3,icon:'clipboard',label:'计划任务',empty:'生成今日任务后开始统计'},
      {ci:4,icon:'hourglass',label:'待办积压',empty:'有打卡记录后开始统计'}
    ];
  }else{
    var cur=pct(last.rate);
    var dTxt, dTone='';
    if(prev){
      var diff=Math.round((cur-pct(prev.rate))*10)/10;
      if(Math.abs(diff)<0.05){ dTxt='与 '+day(prev)+' 持平'; }
      else{
        dTxt='较 '+day(prev)+' <b>'+(diff>0?'+':'')+diff+' 个百分点</b>';
        dTone=diff>0?'up':'down';
      }
    }else{
      dTxt='首日记录 '+day(last)+' · 趋势待积累';
    }
    var leftNow=Math.max(0,n(last.total)-n(last.completed));
    cards=[
      {ci:1,icon:'trend-up',label:'近 7 日完成率',value:Math.round(cur),unit:'%',
       series:series.rate,tone:dTone,ctx:dTxt},
      {ci:2,icon:'check-circle',label:'完成任务',value:n(last.completed),unit:'项',
       series:series.done,tone:'',ctx:'7 日累计 <b>'+sum(series.done)+' 项</b>'},
      {ci:3,icon:'clipboard',label:'计划任务',value:n(last.total),unit:'项',
       series:series.plan,tone:'',ctx:'日均计划 <b>'+(Math.round(avg(series.plan)*10)/10)+' 项</b>'},
      {ci:4,icon:'hourglass',label:'待办积压',value:leftNow,unit:'项',
       series:series.left,tone:leftNow>0?'warn':'',ctx:'7 日累计遗留 <b>'+sum(series.left)+' 项</b>'}
    ];
  }
  host.innerHTML=cards.map(card).join('');
})();

/* ── 知识图谱渲染 (S3-4) ── */
(function(){
  /* [P5 残留修复·图谱 tab 数据驱动] 改造前这里硬编码了 4 个 tab
     （数学/英语/政治/专业课）且默认选中数学：不考数学的文科考生
     （math_key=none / mode_b 双专业课 / mode_c 管综）打开看板，仍会看到
     「数学」页签、甚至默认展示数学知识图谱。
     现改为由内联数据驱动：D.subjects 已由 web/config.py 按考生实际报考科目

  var maps = D.maps || {};

    var _arate = (typeof m.assessed_rate === 'number') ? m.assessed_rate : 0;
    sumBox.innerHTML = "<div class='map-summary'>"
      + "<div style='display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px'>"
      + "<div><b style='font-size:15px'>" + esc(m.subject_name) + " · 考纲全景掌握大盘</b></div>"

      + "<div class='ptrack' style='height:6px;margin-bottom:6px'><div class='pfill' style='width:" + m.mastery_rate + "%;background:var(--ok)'></div></div>"
      + "<div style='font-size:11.5px;color:var(--mut);margin-bottom:10px'>已评估 " + _assessed + " / " + m.total_points + " 个考点 (覆盖率 " + _arate + "%)，未练习考点不计入掌握率</div>"
      + "<div class='map-badges'>"
      + "<span class='mbadge A'>● A 熟练 " + gc.A + "</span>"

      + "<span class='mbadge C'>● C 生疏 " + gc.C + "</span>"

      + "<span class='mbadge U'>○ U 未练 " + (gc.U||0) + "</span>"
      + "<span style='margin-left:auto;font-size:11.5px;color:var(--mut)'>共 " + m.total_points + " 个核心考点</span>"
      + "</div></div>";

    var h = '';
    m.chapters.forEach(function(chap){
      h += "<div class='map-chap'><div class='map-chap-h'><span>" + esc(chap.title) + "</span>"
        + "<span style='font-size:11px;color:var(--mut);font-weight:normal'>" + (chap.points ? chap.points.length : 0) + " 个考点</span></div>";
      if(chap.points && chap.points.length){
        chap.points.forEach(function(pt){
          var g = pt.grade || 'A';
          var errTag = pt.error_count > 0 ? ("<span class='map-err'>"+iconHtml('alert',12)+" " + pt.error_count + " 错题</span>") : "";
          h += "<div class='map-point'>"
             + "<div class='map-point-l'>"
             + "<span class='mbadge " + g + "'>" + g + "</span>"
             + "<span style='font-weight:600'>" + esc(pt.name) + "</span>"
             + (pt.req_type ? ("<span class='map-req'>" + esc(pt.req_type) + "</span>") : "")
             + "</div>"
             + errTag
             + "</div>";
        });
      }
      h += "</div>";
    });
    treeBox.innerHTML = h;
    tex(treeBox);
  }

  renderMap(currSubj);
})();

/* ── 页签切换（无障碍契约） ───────────────────────────────────────────
   [UX 升级] 改造前：纯 onclick，无 role/aria，无键盘漫游，方向键不可用。
   现按 WAI-ARIA Authoring Practices 的 Tabs 模式实现：
     · tablist / tab / tabpanel 语义（标记已在 HTML 中）
     · roving tabindex：仅当前页签 tabindex=0，其余 -1（Tab 键只落一次）
     · ←/→/↑/↓ 循环移动并即时激活；Home/End 跳首尾；Enter/Space 激活
     · aria-selected 与面板显隐同步；切换结果写入 aria-live 区域播报 */
var _tabs = Array.prototype.slice.call(document.querySelectorAll('.bar button[role="tab"]'));
function _activateTab(b, focusIt){
  _tabs.forEach(function(x){
    var on = (x === b);
    x.classList.toggle('on', on);
    x.setAttribute('aria-selected', on ? 'true' : 'false');
    x.setAttribute('tabindex', on ? '0' : '-1');
  });
  document.querySelectorAll('.pane').forEach(function(x){ x.classList.remove('on'); });
  var targetPane = document.getElementById('p-' + b.dataset.p);
  if (targetPane){ targetPane.classList.add('on'); tex(targetPane); }
  if (focusIt) b.focus();
  window.scrollTo(0, 0);
  if (b.dataset.p === 'stat') animate();
  try{ localStorage.setItem('kytab', b.dataset.p); }catch(e){}
  var live = document.getElementById('a11y-live');
  if (live) live.textContent = '已切换到「' + b.textContent.trim() + '」页签';
}
_tabs.forEach(function(b, i){
  b.addEventListener('click', function(){ _activateTab(b, false); });
  b.addEventListener('keydown', function(e){
    var n = -1;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = (i + 1) % _tabs.length;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = (i - 1 + _tabs.length) % _tabs.length;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = _tabs.length - 1;
    else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); _activateTab(b, true); return; }
    else return;
    e.preventDefault();
    _activateTab(_tabs[n], true);
  });
});

/* 空状态 CTA：data-goto 切页签；data-help 展开/收起说明面板。
   用事件委托统一处理 —— 空状态可能出现在构建期注入的正文里，
   逐个绑监听会漏（且 Flash/图谱的空状态是运行时重建的 DOM）。 */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  var go = t.closest('[data-goto]');
  if(go){
    var btn = document.querySelector('.bar button[data-p="' + go.getAttribute('data-goto') + '"]');
    if(btn) btn.click();
    return;
  }
  var hp = t.closest('[data-help]');
  if(hp){
    var box = document.getElementById(hp.getAttribute('data-help'));
    if(!box) return;
    var opening = box.hasAttribute('hidden');
    if(opening){ box.removeAttribute('hidden'); } else { box.setAttribute('hidden',''); }
    hp.setAttribute('aria-expanded', opening ? 'true' : 'false');
  }
});

<canvas id="confetti" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>
<script>
function fireConfetti() {
  if (localStorage.getItem('ky-confetti-off') === '1' || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  const colors = ['#8b5cf6', '#10b981', '#f59e0b', '#3b82f6', '#ec4899'];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: canvas.width / 2, y: canvas.height / 2 + 100,
      r: Math.random() * 6 + 4,
      dx: Math.random() * 10 - 5, dy: Math.random() * -10 - 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      tilt: Math.random() * 10 - 10,
      tiltAngle: 0,
      tiltAngleInc: (Math.random() * 0.07) + 0.05
    });
  }
  let frame = 0;
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;
    particles.forEach(p => {
      p.tiltAngle += p.tiltAngleInc;
      p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
      p.x += Math.sin(p.tiltAngle) * 2;
      p.dy += 0.2; p.y += p.dy; p.x += p.dx;
      if (p.y <= canvas.height) active = true;
      ctx.beginPath();
      ctx.lineWidth = p.r;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
      ctx.stroke();
    });
    if (active && frame < 150) { frame++; requestAnimationFrame(render); }
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  render();
}
</script>
