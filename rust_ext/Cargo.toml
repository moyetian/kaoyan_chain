[package]
name = "ky_rust_ext"
version = "0.1.0"
edition = "2021"

[lib]
name = "ky_rust_ext"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
regex = "1.10"
sha2 = "0.10"
rayon = "1.10"
encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
