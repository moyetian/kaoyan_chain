[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaoyan-study-chain"
version = "3.1.0"
description = "考研全科 AI 私人教师与全自动备考总控系统 (Kaoyan Study Chain)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kaoyan Study Chain Team" }
]
keywords = [
    "kaoyan",
    "study-assistant",
    "ai-agent",
    "postgraduate-exam",
    "cli",
    "gui",
    "rust"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
]
dependencies = [
    "PyYAML>=6.0",
    # CLI 渲染层（tools/cli/repl/renderer.py）的 Panel/Table/语义色渲染依赖；
    # 纯 Python、MIT 许可、无二进制扩展，自带 NO_COLOR 与非 TTY 降级。
    # 属核心依赖：CLI 是产品默认入口，不能只靠 [tui] extra 的传递依赖供给。
    "rich>=13.0",
    # 必须 >= 5.0 且 < 7：代码使用 Scheduler API；4.x 及更早的 fsrs.FSRS 已移除；
    # 7.x 属未验证的大版本区间（曾破坏 Scheduler API），放开前需先跑通 FSRS 用例
    "fsrs>=5.0.0,<7",
    "filelock>=3.12.0"
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
tui = [
    "textual>=0.40.0",
]
# [P0-1 可选依赖·精确 token 计数] 装了走 tiktoken 精确计数，没装则自动降级到
# 五类字符单价启发式（汉字 52 / 中文标点 150 / ASCII 字母 18 / 空白 6 / 其余 95，
# 单位 1/100 token；由 7 条黄金向量 + 3 份留出样本真实标定，最大误差 8.0%）
# —— 见 tools/agent/tokenizer.py。
# 与下面的 `fast` 不同，tiktoken **确实在 PyPI 上**，此 extra 是可安装的。
tokenizer = [
    "tiktoken>=0.7",
]
# [P2-8 修复·不可安装的 extra] 这里原有一个 `fast = ["ky-rust-ext>=0.1.0"]`，
# 但 `ky-rust-ext`（= rust_ext/ 的 crate 名 ky_rust_ext）**从未发布到 PyPI**
# （2026-09-21 核实：https://pypi.org/pypi/ky-rust-ext/json → 404 Not Found），
# 它只由本地 maturin 从 `rust_ext/` 编译产出。于是 `pip install '.[fast]'`
# 必然以 "No matching distribution found" 失败 —— 一个永远装不上的 extra
# 比没有 extra 更糟（用户会以为是自己环境的问题）。
# 故直接移除，改为在 README「Rust 加速为可选」一节写明本地构建步骤；
# **不引入任何新的分发名**（那只会把幻觉固化进依赖图）。
full = [
    "sympy>=1.12",
    "pypdf>=3.0.0",
    "Pillow>=9.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "PySide6>=6.6.0",
    "textual>=0.40.0",
    "tiktoken>=0.7",
]
dev = [
    "pytest>=7.0.0",
    "pytest-timeout",
    "pytest-socket",
    "maturin>=1.0.0",
    # 测试专用依赖（**不进 requirements.txt 主依赖**，产品运行不需要）：
    #   brotli  —— tests/test_adversarial_resiliency.py 的 br 解压对抗用例；
    #              此前未声明 → CI（只装 requirements + [dev]）收集阶段 NameError。
    #   pymupdf —— tests/test_multi_persona_user_journeys.py 与
    #              tests/test_llm_decompression_and_checkin.py 用它**生成**测试 PDF
    #              （产品侧 material_ingestion 只用 pypdf/fitz 且都有守卫）。
    "brotli",
    "pymupdf",
]

[project.scripts]
ky = "tools.ky_cli:main"
ky-gui = "tools.ky_gui:main"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
# 开发/测试脚本随源码留在仓库，但**不进入 wheel 分发**：
# 它们只服务于本地开发与 CI，装到用户环境里既无用又容易被误执行。
exclude = [
    "tools/test_ky_suite.py",
    "tools/test_new_features.py",
    "tools/simulate_workflow.py",
    "tools/build_svg_assets.py",
]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "tools/protocol/AGENTS.md"
"GEMINI.md" = "tools/protocol/GEMINI.md"
# 真实总战役规划由 ky plan 本地生成且已移出版本库（见 .gitignore 隐私规则），
# 故 wheel 内改用随仓库发布的脱敏模板，保证安装模式下协议文件不缺失。
"00_考研全科总战役规划.example.md" = "tools/protocol/00_考研全科总战役规划.md"

[tool.hatch.build]
artifacts = ["*.md", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::ResourceWarning",
  "ignore::DeprecationWarning:cryptography.*",
  "ignore::DeprecationWarning:pypdf.*",
  "default::DeprecationWarning:tools.*"
]
addopts = "--strict-markers -ra"
markers = ["live: 调用真实 API，需显式开启", "slow", "bench"]
timeout = 120
