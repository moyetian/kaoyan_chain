[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaoyan-study-chain"
version = "2.6.0"
description = "考研全科 AI 私人教师与全自动备考总控系统 (Kaoyan Study Chain)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kaoyan Study Chain Team" }
]
keywords = [
    "kaoyan",
    "study-assistant",
    "ai-agent",
    "postgraduate-exam",
    "cli",
    "gui",
    "rust"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
fast = [
    "ky-rust-ext>=0.1.0",
]
full = [
    "sympy>=1.12",
    "pypdf>=3.0.0",
    "Pillow>=9.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "PySide6>=6.6.0",
]
dev = [
    "pytest>=7.0.0",
    "maturin>=1.0.0",
]

[project.scripts]
ky = "tools.ky_cli:main"
ky-gui = "tools.ky_gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
